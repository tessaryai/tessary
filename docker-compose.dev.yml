# Development stack: postgres (localhost:5433), backend (Spring Boot + devtools), frontend (Vite HMR) and
# caddy on TESSARY_DEV_PORT (default 80), with source bind-mounted and build caches in named volumes.
# Usage: `task docker:dev:tmux`, or `docker compose -f docker-compose.dev.yml up -d --build`.
# A non-80 TESSARY_DEV_PORT needs a matching TESSARY_DEV_ORIGIN; scripts/lib/dev-choices.sh derives it.

# Pinned so the stack is identical from any directory, including git worktrees.
name: tessary

services:
  postgres:
    # Postgres 16 with pgvector preinstalled; the same image the test suite uses.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tessary
      POSTGRES_USER: tessary
      POSTGRES_PASSWORD: tessary
    ports:
      # psql -h localhost -p 5433 -U tessary. Not loopback-bound, a known gap: some tooling reaches it from a
      # container via host.docker.internal, which is 172.17.0.1 on Linux and would be refused.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessary -d tessary"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tessary

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: tessary-dev:latest
    # JDWP on 5005 in the forked app JVM only (suspend=n so the healthcheck passes). Two steps: install app's
    # dependency chain, then run only app, since spring-boot:run cannot run reactor-wide.
    command:
      - sh
      - -c
      - >-
        mvn -B -q -pl app -am install -DskipTests
        -Dspotless.check.skip=true -Dpmd.skip=true -Dspotbugs.skip=true &&
        mvn -B -pl app spring-boot:run
        -Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    expose:
      - "8080"
      # Internal OTLP/gRPC; inert unless tessary.ingest.otlp.enabled=true with a grpc transport.
      - "4317"
    ports:
      # JDWP is unauthenticated code execution, so the publish is loopback-only. The agent stays on *:5005
      # because Docker forwards to the container's bridge IP.
      - "127.0.0.1:5005:5005"
      # For a local exporter on localhost:4317; `ports:` works without `EXPOSE`.
      - "127.0.0.1:4317:4317"
    env_file:
      # Optional; without it the stack falls back to application.yaml defaults.
      - path: ./.env
        required: false
    environment:
      TESSARY_JDBC_URL: jdbc:postgresql://postgres:5432/tessary
      TESSARY_DB_USERNAME: tessary
      TESSARY_DB_PASSWORD: tessary
      # Sign-in is enforced, as on a self-hosted install. With TESSARY_AUTH_DISABLED=true no TenantContext
      # resolves, so /auth/me is always 401 and sign-in loops back to the login page. `task dev` asks this.
      TESSARY_AUTH_DISABLED: ${TESSARY_AUTH_DISABLED:-false}
      # The backend's own default is :8000, so the dev origin is passed explicitly.
      TESSARY_AUTH_FRONTEND_URL: ${TESSARY_AUTH_FRONTEND_URL:-${TESSARY_DEV_ORIGIN:-http://localhost}/}
      # Unset, these land on docker-compose.yml's 32-byte placeholders, not blank: blank 500s the first account
      # creation. With no SITE_DOMAIN, PlaceholderSecretGuard only warns. A clean-room boot passes its own values.
      TESSARY_SECRET_KEY: ${TESSARY_SECRET_KEY:-Q0hBTkdFLU1FLWluc2VjdXJlLWRlZmF1bHQtc2VhbCE=}
      TESSARY_AUTH_COOKIE_PASSWORD: ${TESSARY_AUTH_COOKIE_PASSWORD:-Q0hBTkdFLU1FLWluc2VjdXJlLWRlZmF1bHQtY29va2k=}
      # DEBUG for ai.tessary only; prod never sets this.
      APP_LOG_LEVEL: DEBUG
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "false"
      # Inert until MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED=true and the `observability` profile is up;
      # `task dev:profiling` sets both.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: tessary-backend
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOYMENT_NAME:-development},service.namespace=tessary
      # Local dev runs profile-less, so the OTLP endpoint wiring in application-production.yaml is set here via
      # relaxed binding. Spring Boot reads these, not the OTEL_* vars; still inert until export is enabled.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://alloy:4317
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT: grpc
      # Compose forwards a host env var only when the YAML references it, so this line is what lets
      # `task dev:profiling` turn export on.
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:-false}
      MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED: ${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:-false}
      # Exported by the dev-choices.sh chooser (`task dev:configure`) and inert when empty. The analyzer type
      # needs a real default: Spring binds "" over the Java default and ObserverProcessor rejects it at boot.
      TESSARY_OBSERVER_AGENTIC_LAUNCHER_URL: ${TESSARY_OBSERVER_AGENTIC_LAUNCHER_URL:-}
      # docker-compose.yml's placeholder, so an unconfigured launcher and backend still agree.
      TESSARY_OBSERVER_AGENTIC_LAUNCHER_API_KEY: ${TESSARY_OBSERVER_AGENTIC_LAUNCHER_API_KEY:-Q0hBTkdFLU1FLWluc2VjdXJlLWRlZmF1bHQtbGF1bmNo}
      # Defaults onto the observer's launcher. Without it every "Run RCA" fails.
      TESSARY_RCA_AGENTIC_LAUNCHER_URL: ${TESSARY_RCA_AGENTIC_LAUNCHER_URL:-${TESSARY_OBSERVER_AGENTIC_LAUNCHER_URL:-}}
      TESSARY_RCA_AGENTIC_LAUNCHER_API_KEY: ${TESSARY_RCA_AGENTIC_LAUNCHER_API_KEY:-${TESSARY_OBSERVER_AGENTIC_LAUNCHER_API_KEY:-Q0hBTkdFLU1FLWluc2VjdXJlLWRlZmF1bHQtbGF1bmNo}}
      # Required; blank stops both agent lanes. agents=docker overrides it to http://backend:8080. Under
      # agents=e2b the microVM cannot see localhost, so point this at a public tunnel.
      TESSARY_RCA_AGENTIC_MCP_BASE_URL: ${TESSARY_RCA_AGENTIC_MCP_BASE_URL:-${TESSARY_DEV_ORIGIN:-http://localhost}}
      TESSARY_CLASSIFIER_TRIAGE_MCP_BASE_URL: ${TESSARY_CLASSIFIER_TRIAGE_MCP_BASE_URL:-${TESSARY_RCA_AGENTIC_MCP_BASE_URL:-${TESSARY_DEV_ORIGIN:-http://localhost}}}
      # Read here because `environment:` overrides `env_file:`. On a Mac, serve.py runs natively at
      # http://host.docker.internal:<port>. Blank skips groundedness sweeps.
      TESSARY_OBSERVER_ENCODER_URL: ${TESSARY_OBSERVER_ENCODER_URL:-}
      TESSARY_OBSERVER_ENCODER_API_KEY: ${TESSARY_OBSERVER_ENCODER_API_KEY:-}
      TESSARY_GROUNDEDNESS_CLASSIFIER_MODE: ${TESSARY_GROUNDEDNESS_CLASSIFIER_MODE:-}
    volumes:
      # Every module's src must be mounted: a pom without src installs a class-less jar. A module added to the
      # aggregator must be added here too.
      - ./backend/shared/src:/app/shared/src
      - ./backend/contract/src:/app/contract/src
      - ./backend/test-support/src:/app/test-support/src
      - ./backend/core/src:/app/core/src
      - ./backend/tenancy/src:/app/tenancy/src
      - ./backend/substrate/src:/app/substrate/src
      - ./backend/product/src:/app/product/src
      - ./backend/llm-runtime/src:/app/llm-runtime/src
      - ./backend/analysis/src:/app/analysis/src
      - ./backend/surfaces/src:/app/surfaces/src
      - ./backend/app/src:/app/app/src
      - ./backend/pom.xml:/app/pom.xml:ro
      - ./backend/shared/pom.xml:/app/shared/pom.xml:ro
      - ./backend/contract/pom.xml:/app/contract/pom.xml:ro
      - ./backend/test-support/pom.xml:/app/test-support/pom.xml:ro
      - ./backend/core/pom.xml:/app/core/pom.xml:ro
      - ./backend/tenancy/pom.xml:/app/tenancy/pom.xml:ro
      - ./backend/substrate/pom.xml:/app/substrate/pom.xml:ro
      - ./backend/product/pom.xml:/app/product/pom.xml:ro
      - ./backend/llm-runtime/pom.xml:/app/llm-runtime/pom.xml:ro
      - ./backend/analysis/pom.xml:/app/analysis/pom.xml:ro
      - ./backend/surfaces/pom.xml:/app/surfaces/pom.xml:ro
      - ./backend/app/pom.xml:/app/app/pom.xml:ro
      # Build inputs the prod Dockerfile copies (PMD/SpotBugs config, the schema-column generator, JDK 25
      # --add-exports for Error Prone), mounted so the in-container build matches.
      - ./backend/config:/app/config:ro
      - ./backend/core/tools:/app/core/tools:ro
      - ./backend/.mvn:/app/.mvn:ro
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # bash's /dev/tcp needs no curl; Spring binds :8080 only once fully started.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    networks:
      - tessary

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      # Keep this fallback equal to the Taskfile's PNPM_VERSION by hand.
      args:
        PNPM_VERSION: ${PNPM_VERSION:-11.15.1}
    image: tessary-frontend-dev:latest
    expose:
      - "5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      # src/index.css imports ../tokens.css. The image copies only lockfiles, so root-level files are mounted by name.
      - ./frontend/tokens.css:/app/tokens.css:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      # pnpm 11 reads overrides from here during the startup `pnpm install --frozen-lockfile`.
      - ./frontend/pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      # A named volume, so the host's node_modules cannot shadow the image's.
      - frontend-node-modules:/app/node_modules
    networks:
      - tessary

  caddy:
    image: caddy:2-alpine
    ports:
      # Loopback by default: with placeholder secrets or auth disabled, this port is the whole application.
      # HOST_BIND=0.0.0.0 to test from another device. The container side stays 8000.
      - "${HOST_BIND:-127.0.0.1}:${TESSARY_DEV_PORT:-80}:8000"
    environment:
      BACKEND_URL: backend:8080
      FRONTEND_URL: frontend:5173
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - tessary

  # Optional local telemetry agent (`observability` profile, off by default): forwards gen_ai spans to
  # Langfuse to inspect prompt-cache usage. Needs LANGFUSE_* keys in .env. `task dev:profiling` starts it.
  alloy:
    profiles: ["observability"]
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      DEPLOYMENT_NAME: ${DEPLOYMENT_NAME:-development}
      # Blank by default, so the profile without Langfuse keys does not dial Langfuse Cloud.
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-}
      # Alloy rejects empty basic-auth credentials at config load, so a fake placeholder makes the push 401 instead.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev-unset}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev-unset}
    volumes:
      - ./observability/alloy/config.dev.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - tessary

  # Agentic launcher, built from this checkout. Off by default locally: the `launcher` profile is enabled when
  # the dev-choices.sh chooser picks agents=docker or e2b. For e2b, publish the template under the same team
  # as E2B_API_KEY first (sandbox-runner/agent-sandbox: `pnpm exec tsx build.ts`).
  sandbox-runner:
    profiles:
      - launcher
    build:
      context: ./sandbox-runner/launcher
      args:
        PNPM_VERSION: ${PNPM_VERSION:-11.15.1}
    image: tessary-sandbox-runner-dev:latest
    expose:
      - "8080"
    environment:
      PORT: "8080"
      # Exported by dev-choices.sh; unset means server.js's default, `docker`. The docker wiring below mirrors
      # docker-compose.yml; server.js exits at boot on docker without SANDBOX_WORK_VOLUME.
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-}
      # agents=docker builds this from the checkout and exports the tag; the default only reaches a bare
      # `COMPOSE_PROFILES=launcher docker compose`.
      AGENT_IMAGE: ${AGENT_IMAGE:-tessaryai/tessary:agent-sandbox-${TESSARY_VERSION:-latest}}
      SANDBOX_DOCKER_CONCURRENCY: ${SANDBOX_DOCKER_CONCURRENCY:-1}
      # A different default from the prod stack, so dev and prod launchers on one host never share a volume.
      SANDBOX_WORK_VOLUME: ${SANDBOX_WORK_VOLUME:-tessary-sandbox-work-dev}
      # Must equal the backend's TESSARY_OBSERVER_AGENTIC_LAUNCHER_API_KEY.
      SANDBOX_API_KEY: ${TESSARY_OBSERVER_AGENTIC_LAUNCHER_API_KEY:-Q0hBTkdFLU1FLWluc2VjdXJlLWRlZmF1bHQtbGF1bmNo}
      E2B_API_KEY: ${E2B_API_KEY:-}
      # Namespaced and floating, as in docker-compose.yml.
      E2B_ANALYZER_TEMPLATE: ${E2B_ANALYZER_TEMPLATE:-tessary/tessary-agent-sandbox:${TESSARY_VERSION:-latest}}
      # No provider secret here; each run carries the org's own credential. MANTLE_PROJECT_ID is not a secret.
      MANTLE_PROJECT_ID: ${TESSARY_MANTLE_PROJECT_ID:-}
    # Mirrors docker-compose.yml's group_add, mounts and default GID of 0; see the comment there.
    group_add:
      - "${DOCKER_SOCK_GID:-0}"
    depends_on:
      sandbox-runner-work-init:
        condition: service_completed_successfully
    volumes:
      # Picks up server.js edits on `--force-recreate` without a rebuild.
      - ./sandbox-runner/launcher/server.js:/app/server.js:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-work:/launcher-work
    networks:
      - tessary

  # Mirrors docker-compose.yml's sandbox-runner-work-init.
  sandbox-runner-work-init:
    profiles:
      - launcher
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /launcher-work && chown 1000:1000 /launcher-work"]
    volumes:
      - sandbox-work:/launcher-work
    restart: "no"

networks:
  tessary:
    driver: bridge

volumes:
  maven-cache:
  frontend-node-modules:
  caddy-data:
  caddy-config:
  postgres-data:
  alloy-data:
  # Explicit `name:`, as in docker-compose.yml: the launcher hands this exact string to the Engine API.
  sandbox-work:
    name: ${SANDBOX_WORK_VOLUME:-tessary-sandbox-work-dev}
