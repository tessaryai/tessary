version: '3'

# Top-level dev commands (https://taskfile.dev/installation/). `task dev` serves the whole stack at
# http://localhost (TESSARY_DEV_PORT, default 80).

vars:
  SESSION: tessary-dev
  # scripts/lib/dev-compose.sh is the one derivation of every dev compose string. Two separate `sh:` calls
  # so neither var depends on the other's resolution order.
  DC_DEV:
    sh: 'bash scripts/lib/dev-compose.sh'
  # Teardown only. It adds the profiling overlay so `down` also removes pyroscope; never use it for `up`,
  # which would attach a -javaagent nobody asked for.
  DC_DEV_ALL:
    sh: 'bash scripts/lib/dev-compose.sh -f docker-compose.profiling.yml'
  # For anything that creates or recreates dev containers: re-resolves the saved `task dev` choices
  # without prompting. Read-only calls (logs, exec, ps) stay on DC_DEV.
  DC_DEV_UP: 'bash scripts/lib/dev-choices.sh compose'
  # Every prod target, teardown included, goes through this one string.
  DC_PROD: 'docker compose -f docker-compose.yml'

# The pnpm version for local image builds. The compose files and Dockerfiles carry the same literal as a
# default; keep every copy, the `packageManager` fields and the CI `PNPM_VERSION` variable equal by hand.
env:
  PNPM_VERSION: "11.15.1"
  # Short and full SHA, as release.yml tags; both flow into docker-compose.yml's build args.
  IMAGE_VERSION:
    sh: git rev-parse --short HEAD 2>/dev/null || echo dev
  IMAGE_REVISION:
    sh: git rev-parse HEAD 2>/dev/null || echo unknown

tasks:
  default:
    desc: Print available tasks.
    cmds:
      - task --list

  # ---- dev: run everything (docker + tmux) ----
  dev:
    desc: 'Launch the dev stack inside tmux (logs in tabbed windows + a shell). Runs like a self-hosted install: on first run it asks where triage and RCA agents run and whether to enforce sign-in, then remembers the answers in .local/dev-choices.env.'
    cmds:
      - bash scripts/dev.sh

  # The questions `task dev` asks once, asked again, and nothing started. The stack picks the new
  # answers up on its next `task dev` or `task dev:up`.
  dev:configure:
    desc: 'Answer the dev stack''s questions again (agents: docker/e2b/off, sign-in) and save them. Restart the stack to apply.'
    interactive: true
    cmds:
      - bash scripts/lib/dev-choices.sh configure

  # Profiling is a MODIFIER, not a separate stack: scripts/dev.sh reads TESSARY_PROFILING and
  # self-heals the agent jar, so `TESSARY_PROFILING=1` in front of any dev task works too. This
  # task is just the common combination spelled out.
  dev:profiling:
    desc: Dev stack + continuous CPU profiling. Flame graphs at http://localhost:4040 (local Pyroscope, no cloud account needed).
    env:
      TESSARY_PROFILING: "1"
    cmds:
      - bash scripts/dev.sh

  # ---- restart shortcuts (rb / rf / rc) ----
  # Assume `task dev` is running. Each shortcut targets the matching tmux
  # window by name, kills its log tail with C-c, force-recreates the container
  # so new env / volumes / images take effect, and re-attaches the log tail.
  # Use the `:full` variants when an image rebuild is needed (Dockerfile,
  # pom.xml, or package.json changes).
  rb:
    aliases: [restart:backend]
    desc: Restart backend container (fast — no image rebuild).
    cmds:
      - tmux send-keys -t {{.SESSION}}:backend C-c
      - sleep 1
      - "{{.DC_DEV_UP}} up -d --no-deps --force-recreate backend"
      - tmux send-keys -t {{.SESSION}}:backend "{{.DC_DEV}} logs -f --no-log-prefix backend" Enter

  rf:
    aliases: [restart:frontend]
    desc: Restart frontend container (fast — no image rebuild; Vite HMR resumes).
    cmds:
      - tmux send-keys -t {{.SESSION}}:frontend C-c
      - sleep 1
      - "{{.DC_DEV_UP}} up -d --no-deps --force-recreate frontend"
      - tmux send-keys -t {{.SESSION}}:frontend "{{.DC_DEV}} logs -f --no-log-prefix frontend" Enter

  rc:
    aliases: [restart:caddy]
    desc: Restart Caddy reverse proxy (picks up Caddyfile changes).
    cmds:
      - tmux send-keys -t {{.SESSION}}:caddy C-c
      - sleep 1
      - "{{.DC_DEV_UP}} up -d --no-deps --force-recreate caddy"
      - tmux send-keys -t {{.SESSION}}:caddy "{{.DC_DEV}} logs -f --no-log-prefix caddy" Enter

  rb:full:
    desc: Rebuild backend image (use when pom.xml / backend Dockerfile changes).
    cmds:
      - tmux send-keys -t {{.SESSION}}:backend C-c
      - sleep 1
      - "{{.DC_DEV_UP}} up -d --build --force-recreate --no-deps backend"
      - tmux send-keys -t {{.SESSION}}:backend "{{.DC_DEV}} logs -f --no-log-prefix backend" Enter

  rf:full:
    desc: Rebuild frontend image + reinstall deps (use when package.json / frontend Dockerfile changes).
    cmds:
      - tmux send-keys -t {{.SESSION}}:frontend C-c
      - sleep 1
      - docker volume rm -f tessary_frontend-node-modules 2>/dev/null || true
      - "{{.DC_DEV_UP}} up -d --build --force-recreate --no-deps frontend"
      - tmux send-keys -t {{.SESSION}}:frontend "{{.DC_DEV}} logs -f --no-log-prefix frontend" Enter

  logs:
    desc: 'Tail logs for a single dev service. Usage: task logs -- backend'
    cmds:
      - "{{.DC_DEV}} logs -f --no-log-prefix {{.CLI_ARGS}}"

  # ---- backend ----
  backend:
    desc: Run the Spring Boot backend (dev mode, JVM). Needs Postgres 16 + pgvector via TESSARY_JDBC_URL (e.g. `task dev:up`).
    dir: backend
    env:
      # Hardcoded on purpose: this task loads no dotenv and, without WorkOS credentials, every /api/** call
      # would 401. Exporting a WorkOS key does not change it; edit this line to test enforced auth locally.
      TESSARY_AUTH_DISABLED: "true"
    cmds:
      # spring-boot:run cannot run reactor-wide, and app alone cannot resolve uninstalled siblings.
      - mvn -q -pl app -am install -DskipTests
      - mvn -q -pl app spring-boot:run

  backend:test:
    desc: Run backend JUnit tests.
    dir: backend
    cmds:
      - mvn -q test

  backend:format:
    desc: Auto-format backend Java in place (Spotless + palantir-java-format).
    dir: backend
    cmds:
      - mvn -q spotless:apply

  backend:lint:
    desc: Fast backend static-analysis-only shortcut (Spotless + bound quality plugins, no tests). For the full gate use backend:check.
    dir: backend
    cmds:
      - mvn -q -DskipTests verify

  backend:check:
    desc: Full backend gate — compile, tests, and static analysis in ONE Maven reactor. Shared with CI via scripts/check-backend.sh.
    cmds:
      - bash scripts/check-backend.sh

  contract:openapi:
    desc: "Regenerate the checked-in canonical OpenAPI spec (backend/contract/src/main/resources/openapi/tessary-api.json) from the controllers via springdoc. Run after any controller/DTO change that shifts the wire contract, then commit the regenerated spec (OpenApiSpecDriftTest fails backend:check until you do)."
    cmds:
      - mvn -f backend/pom.xml -pl app -am -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest=OpenApiSpecDriftTest -Dtessary.openapi.regenerate=true test

  backend:coverage:
    desc: "Refresh the JaCoCo coverage baseline for the 11 backend modules. Runs the IDENTICAL command as backend:check — same reactor, same full Spotless/forbidden-apis/SpotBugs/PMD/Error Prone/NullAway/test gate — it is not a lighter or coverage-only path, and a lint or static-analysis failure anywhere in the reactor aborts it before jacoco:report runs, same as it would for backend:check. It exists only as a separately-named entry point for refreshing coverage locally; CI's check.yml uploads the same reports on every pull request. Only the coverage NUMBER is non-gating — no threshold is enforced on it anywhere. Needs Docker: `app` is the one module in this list with Testcontainers-backed @SpringBootTest coverage to record. Per-module reports land at backend/<module>/target/site/jacoco/index.html; the cross-module aggregate, which credits the app module's @SpringBootTest runs to the module that owns the code, lands at backend/app/target/site/jacoco-aggregate/index.html."
    cmds:
      # Through the script, not a bare mvn invocation: the JDK-major-25 guard has to run before
      # Maven starts, or a mismatch surfaces as an opaque PMD/compiler crash deep in the reactor
      # instead of a clear message.
      - bash scripts/check-backend.sh

  check:license-headers:
    desc: "SPDX header presence over the tree. Pass --fix to insert missing headers in place: task check:license-headers -- --fix. Shared with CI via scripts/check-license-headers.sh."
    cmds:
      - bash scripts/check-license-headers.sh {{.CLI_ARGS}}

  backend:build:
    desc: Build the backend executable (layered) bootJar.
    dir: backend
    cmds:
      - mvn -q clean package -DskipTests

  # Every Node package uses pnpm and keeps its own lockfile (deliberately not a workspace) so each
  # Dockerfile builds from its own directory.
  node:install:
    desc: Install deps for every Node package (pnpm). Run this once after creating a worktree.
    cmds:
      - for: [frontend, sandbox-runner/launcher, sandbox-runner/agent-sandbox]
        task: _node:install:one
        vars: { DIR: '{{.ITEM}}' }

  # Shared by node:install and frontend:install so the pre-pnpm self-heal below is defined once.
  _node:install:one:
    internal: true
    cmds:
      # silent: Task would otherwise echo this whole block once per package, burying pnpm's output.
      - silent: true
        cmd: |
          cd "{{.DIR}}"
          # Clears an npm-era node_modules (no .pnpm/ marker): pnpm never removes npm's tree, and leftover flat
          # layout would let undeclared transitive imports keep resolving.
          if [ -d node_modules ] && [ ! -d node_modules/.pnpm ]; then
            echo "{{.DIR}}: clearing pre-pnpm (npm) node_modules before installing"
            rm -rf node_modules
          fi
          pnpm install

  # ---- frontend ----
  frontend:install:
    desc: Install frontend deps (pnpm). For every Node package at once use node:install.
    cmds:
      - task: _node:install:one
        vars: { DIR: frontend }

  frontend:
    desc: Run the Vite dev server (HMR; expects backend on :8080).
    dir: frontend
    cmds:
      - pnpm run dev

  frontend:typecheck:
    desc: Fast type-check only (tsc --noEmit). For the full gate use frontend:check.
    dir: frontend
    cmds:
      - pnpm run lint

  frontend:check:
    desc: Full frontend gate — type-check, tests and production bundle. Shared with CI via scripts/check-frontend.sh.
    cmds:
      - bash scripts/check-frontend.sh

  frontend:build:
    desc: Build the frontend static bundle.
    dir: frontend
    cmds:
      - pnpm run build

  # ---- caddy ----
  caddy:
    desc: Run Caddy reverse proxy on :8000.
    cmds:
      - caddy run --config Caddyfile

  caddy:validate:
    desc: Validate the Caddyfiles and check every open-spec route is proxied. Shared with CI via scripts/check-caddy.sh.
    cmds:
      - bash scripts/check-caddy.sh

  sandbox-runner:check:
    desc: Gate for sandbox-runner/launcher (syntax + node:test docker-backend coverage against a fake Docker daemon; no real Docker needed) and sandbox-runner/agent-sandbox (node:test agent-stream.js retry/turn-accumulation coverage). Shared with CI via scripts/check-sandbox-runner-launcher.sh.
    cmds:
      - bash scripts/check-sandbox-runner-launcher.sh

  check:price-book-contract:
    desc: "The vendored price book stays at its pinned path, parses as a LiteLLM-shaped object with a floor of priced models, and every in-repo reader and writer names that path. tessary-home fetches it by raw GitHub URL, so a move breaks every instance's price updates. Runs in `task check` and in price-book-refresh.yml."
    cmds:
      - bash scripts/check-price-book-contract.sh

  migrations:populated:
    desc: "Run the migrations a release adds against ROWS: apply the chain through the pinned baseline to a throwaway Postgres, load scripts/lib/populated-fixture.sql, apply everything after it, and assert every renamed value moved. Deliberately NOT in `task check` — `task check` migrates EMPTY Testcontainers databases, where a failing ADD CONSTRAINT and a zero-row UPDATE both pass. Run it before merging a migration that renames or narrows a persisted value. With no migration after the baseline it still runs end to end and reports that, which is how the fixture stays proven loadable between releases."
    cmds:
      - bash scripts/check-migrations-populated.sh {{.CLI_ARGS}}

  contract:check:
    desc: Assert the vendored evals contract is internally consistent (schema $id parses; validator files present; VERSION names a release).
    cmds:
      - bash scripts/check-contract-consistency.sh

  contract:plugin:
    desc: "Gate the vendored evals plugin: run the validator's rules (contract/tests) and prove the vendored copy still matches tessaryai/plugins@main. The plugins repo is public and runs no PR CI on purpose, so this is where that enforcement lives. Offline the freshness half warns and passes; in CI it fails."
    cmds:
      - bash scripts/check-vendored-plugin.sh

  # ---- combined ----
  # The project gate. CI is a per-PR gate: .github/workflows/check.yml runs `bash scripts/check.sh`
  # on `pull_request:`, which is this same manifest, so local green => CI green on the same script.
  # drift-checks.yml holds the one gate check.sh does NOT run (vendored-plugin's freshness half),
  # dispatch-only. Merge-blocking is still not possible: branch protection is plan-gated on this
  # repo.
  # Each target here and CI invoke the SAME scripts/check-*.sh, so the gate is defined once. There
  # are no per-gate CI JOBS to pair with: check.yml runs one job calling check.sh:
  #   contract:check        -> scripts/check-contract-consistency.sh (vendored contract drift)
  #   contract:plugin       -> scripts/check-vendored-plugin.sh (validator rules + freshness; drift-checks.yml)
  #   backend:check         -> scripts/check-backend.sh  (mvn -B -T 2 verify)
  #   frontend:check        -> scripts/check-frontend.sh (pnpm run lint + pnpm run test [the route
  #                            render smoke test] + pnpm run build)
  #   caddy:validate        -> scripts/check-caddy.sh    (caddy validate + spec route coverage)
  #   check:license-headers -> scripts/check-license-headers.sh (SPDX header presence)
  #   migrations:populated (not in `check`) -> scripts/check-migrations-populated.sh
  # These are THREE gate sets, not one. `task check` (i.e. scripts/check.sh) runs 17 of the 30
  # scripts/check-*.sh. The 13 it does not run each carry an EXCLUDED manifest row, so the
  # completeness assertion covers them: check-migrations-populated.sh (wants a populated
  # Postgres), check-vendored-plugin.sh (network; drift-checks.yml), the boot, self-host, egress,
  # exposure and artifact checks (Docker and minutes; boot-checks.yml or release.yml), and
  # check-dependency-audit.sh and check-notice-coverage.sh (manual/on-demand only, no real
  # credential in any check). scripts/check.sh's manifest is where each gate's disposition is
  # declared, and the manifest is asserted complete against the scripts on disk before anything
  # runs.
  # (A first-party OTLP-producer SDK previously lived under sdk/ with its own on-demand gate; it was
  # removed to be rebuilt from scratch when needed. The platform consumes standard OTLP attributes from
  # any producer, so nothing in `check` depends on it.)
  check:
    desc: 'The project gate, mirroring CI. No argument runs everything. An argument narrows it to a comma-separated list of slices, where a slice is a backend product area or `frontend`: task check -- rca,metering / task check -- frontend. Nothing enforces this locally — CI is the gate — so run the slices your change touches before pushing.'
    # silent: Task would otherwise echo the invocation above the gate's own output. The logic lives
    # in scripts/check.sh so it is readable, shellcheck-able, and runnable without Task — CI calls
    # the scripts directly and never loads this file.
    silent: true
    cmds:
      # The empty "{{.CLI_ARGS}}" is the positional slice slot: `task check`, `task check --
      # rca,metering` and the unknown-slice error path all go through it.
      - bash scripts/check.sh "{{.CLI_ARGS}}"

  check:open:boot:
    desc: "The detached open-edition BOOT check (EXCLUDED from `task check` and from scripts/check.sh's manifest, see check-open-boot.sh's own header for why). Exports the working tree via scripts/lib/export-simulate.sh's copy+git-init recipe, boots the dev stack keyless in that export, and asserts caddy serves the dev port with an authenticated triage flow producing a real classifier verdict and no denied credential anywhere. Stores a clearly-fake placeholder credential under OPEN_BOOT_PROVIDER_NAME (default ANTHROPIC), no real key, no secret, ever. Needs Docker and a couple of minutes; manual/local use, or boot-checks.yml in CI, never run by an agent (see CLAUDE.md's toolchain notes)."
    cmds:
      - bash scripts/check-open-boot.sh

  check:open:boot:selfhost:
    desc: "The self-host gate's second leg: boots the SELF-HOST artifact, docker-compose.yml, in a clean-room export under the production profile (AuthRequiredInProdGuard, real backend/frontend Dockerfiles, sandbox-runner on the docker default) with only generated run-scoped values and no cloud credential. Needs Docker and minutes; never run by an agent; EXCLUDED from `task check`."
    cmds:
      - bash scripts/check-open-boot-selfhost.sh {{.CLI_ARGS}}

  check:open:artifacts:
    desc: "Builds the four open images release.yml publishes and diffs each one's real contents (every file, every jar entry, the served bundle) against scripts/lib/open-artifact-denylist.txt; --negative also proves the diff goes red on one planted violation per role. Needs Docker and minutes; EXCLUDED from `task check`; release.yml runs the same script against the images it just built before merging any manifest."
    cmds:
      - bash scripts/check-open-artifacts.sh {{.CLI_ARGS}}

  check:namespaces:
    desc: "Every registry, hub and source-control coordinate the tree references resolves to tessaryai through the platform's own ownership signal, and every referenced coordinate is in scripts/lib/namespace-inventory.txt; --negative proves the check goes red on a foreign coordinate. Needs the network (and gh auth while the repository is private). EXCLUDED from `task check`; quarterly plus dispatch via namespace-recheck.yml."
    cmds:
      - bash scripts/check-namespaces.sh {{.CLI_ARGS}}

  check:exposure:sweep:
    desc: "Boots the self-host artifact keyless under the production profile and attacks it from outside and from a neighbouring tenant: every spec operation unauthenticated, default credentials, the served bundle for maps and secrets, SSRF and traversal against a listener on the stack network, and a two-tenant substitution sweep. Writes the result set with --record so a later run can re-run it unmodified and diff. Needs Docker and minutes; never run by an agent; EXCLUDED from `task check`."
    cmds:
      - bash scripts/check-exposure-sweep.sh {{.CLI_ARGS}}

  check:selfhost:quickstart:
    desc: "The self-host quickstart rehearsal. Executes docs/self-hosting/setup.mdx's own command blocks verbatim in a clean-room export on the compose defaults (needs ports 80 and 443 free), asserts every Check as the page words it, and walks the onboarding ladder to fitting. Pass -- --build while the images are unpublished. Docker and minutes; never run by an agent; EXCLUDED from `task check`."
    cmds:
      - bash scripts/check-selfhost-quickstart.sh {{.CLI_ARGS}}

  check:zero:egress:
    desc: "Opt-out means silent. Runs the quickstart rehearsal on an internal network with a DNS sink and TESSARY_TELEMETRY_ENABLED=false, asserts no lookup outside the permitted set on docs/self-hosting/configuration.mdx, no daemon pull in the window, no foreign origin on the served page; then the heartbeat as positive control and a planted call. Pass -- --build while the images are unpublished. Docker, ports 80/443, minutes; never run by an agent; EXCLUDED from `task check`."
    cmds:
      - bash scripts/check-zero-egress.sh {{.CLI_ARGS}}

  check:selfhost:images:
    desc: "Asserts the four published image references (backend/frontend/sandbox-runner/AGENT_IMAGE) resolve with no registry login, are labeled with the version they're tagged as, and cover linux/amd64 + linux/arm64 — at BOTH `<service>-<version>` and `<service>-latest`, since an unset TESSARY_VERSION now resolves to the floating tag. Reads the version from the newest `v<semver>` git tag; pass `-- --version=<semver>` to check a specific release. Needs Docker and the network; never run by an agent; EXCLUDED from `task check`; run before the self-host boot job in boot-checks.yml."
    cmds:
      - bash scripts/check-selfhost-images.sh {{.CLI_ARGS}}

  check:selfhost:compose:
    desc: "The one-command install, end to end. Publishes docker-compose.yml as an OCI artifact to a throwaway TLS registry on this host, then runs `docker compose -f oci://.../tessary:compose up -d -y` from an EMPTY directory (no clone, no .env, no build context) and asserts the stack reaches healthy, pins this release's image tags, mounts no host path, leaves the working directory empty, and tears down clean. Builds four images and boots a stack; never run by an agent; EXCLUDED from `task check`; run by boot-checks.yml's fourth job."
    cmds:
      - bash scripts/check-selfhost-compose-artifact.sh

  publish:compose:
    desc: "Publish docker-compose.yml as the OCI artifact behind the one-command install, to Docker Hub and GHCR under `compose` and `compose-<version>`. The published copy is build-stripped AND version-stamped: the file in the repository holds no version literal, so the release's own version is substituted into its floating image defaults on the way out. Version comes from `--version=` (what release.yml passes) or the newest `v<semver>` git tag. Normally run by release.yml AFTER the images are merged and parity-verified, never on its own; needs a registry login for both repositories. Add --dry-run to see what it would write."
    cmds:
      - bash scripts/publish-compose-artifact.sh {{.CLI_ARGS}}
  egress:capture:
    desc: "Boots docker-compose.yml twice (TESSARY_TELEMETRY_ENABLED=true, then =false) and tcpdumps the compose network's own bridge interface on the HOST for each boot, proving the true pass reaches exactly {home.tessary.ai} and the false pass reaches nothing. Needs Docker, tcpdump, a Linux Docker host (not Docker Desktop for Mac/Windows — see scripts/lib/egress-capture.sh's header), and minutes; never run by an agent; EXCLUDED from `task check` and from scripts/check.sh's manifest by name (the script lives at scripts/lib/, not scripts/check-*.sh — see its own header for why)."
    cmds:
      - bash scripts/lib/egress-capture.sh

  # ---- docker (dev) ----
  # No tmux, so this is the only `up` available to CI, agents, and a plain ssh. It goes through a
  # script rather than inlining `{{.DC_DEV}} up -d --build` so the saved dev choices are resolved
  # and exported first, exactly as `task dev` does.
  dev:up:
    desc: 'Start the dev stack detached, no tmux (build on demand). Same questions as `task dev` on a terminal; saved answers or the non-interactive defaults otherwise.'
    cmds:
      - bash scripts/dev-up.sh

  dev:stop:
    desc: Stop the dev stack and kill its tmux session.
    cmds:
      - tmux kill-session -t {{.SESSION}} 2>/dev/null || true
      # DC_DEV_ALL and `--profile '*'`, so the profiling and launcher containers do not outlive the stop.
      - "{{.DC_DEV_ALL}} --profile '*' down --remove-orphans"

  dev:logs:
    desc: Tail combined logs from the dev stack.
    cmds:
      - "{{.DC_DEV}} logs -f"

  dev:reload-backend:
    desc: Recompile Java in the running backend container; devtools restarts on classpath change.
    cmds:
      - "{{.DC_DEV}} exec backend mvn -q compile"

  # ---- docker (prod) ----
  prod:build:
    desc: Build prod images (fast JVM layered bootJar build; dependency layers cache across rebuilds).
    cmds:
      - '{{.DC_PROD}} build'

  prod:up:
    desc: Start the prod stack detached.
    cmds:
      - '{{.DC_PROD}} up -d'

  prod:down:
    desc: Stop the prod stack.
    cmds:
      - '{{.DC_PROD}} down'

  prod:logs:
    desc: Tail combined logs from the prod stack.
    cmds:
      - '{{.DC_PROD}} logs -f'
