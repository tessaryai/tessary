# Evals dev session — project-local tmux config.
# Sourced automatically by scripts/dev.sh on session start.
# Personal preferences (theme, copy-paste, etc.) belong in ~/.tmux.conf.

# Mouse support — click to switch windows, scroll logs
set -g mouse on

# No-prefix navigation and restart shortcuts for the evals-dev session.
# These bindings are session-aware and fall back to normal key behavior
# outside the tmux session created by scripts/dev.sh.
bind-key -n Tab  if-shell -F "#{==:#{session_name},evals-dev}" "next-window" "send-keys Tab"
bind-key -n BTab if-shell -F "#{==:#{session_name},evals-dev}" "previous-window" "send-keys BTab"

# 0..3 jump to windows 0..3 in the dev session (shell/backend/frontend/caddy).
bind-key -n 0 if-shell -F "#{==:#{session_name},evals-dev}" "select-window -t :0" "send-keys 0"
bind-key -n 1 if-shell -F "#{==:#{session_name},evals-dev}" "select-window -t :1" "send-keys 1"
bind-key -n 2 if-shell -F "#{==:#{session_name},evals-dev}" "select-window -t :2" "send-keys 2"
bind-key -n 3 if-shell -F "#{==:#{session_name},evals-dev}" "select-window -t :3" "send-keys 3"

# r then f/b/c restarts services in the dev session.
bind-key -n r if-shell -F "#{==:#{session_name},evals-dev}" "switch-client -T evals-restart" "send-keys r"
bind-key -T evals-restart f run-shell -b "cd \"#{session_path}\" && task rf" \; switch-client -T root
bind-key -T evals-restart b run-shell -b "cd \"#{session_path}\" && task rb" \; switch-client -T root
bind-key -T evals-restart c run-shell -b "cd \"#{session_path}\" && task rc" \; switch-client -T root
bind-key -T evals-restart Escape switch-client -T root
bind-key -T evals-restart q switch-client -T root
bind-key -T evals-restart Any switch-client -T root

# Ctrl+e gracefully stops the dev environment (task dev:stop).
bind-key -n C-e if-shell -F "#{==:#{session_name},evals-dev}" "run-shell -b \"cd \\\"#{session_path}\\\" && task dev:stop\"" "send-keys C-e"

# Copy to system clipboard on mouse drag
# Works on macOS (pbcopy) and Linux (xclip)
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
  bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}
