# pnpm settings for this package. NOT a workspace definition — there is no `packages:` key, so this
# stays a plain single project (the repo deliberately has no root workspace; each Node package keeps
# its own lockfile so the Dockerfiles can build from their own directory).
#
# This file exists because pnpm 11 removed the `pnpm` field in package.json and reads .npmrc for auth
# and registry only; every other setting lives here. It MUST be COPYed alongside package.json and
# pnpm-lock.yaml in any Dockerfile that installs this package, or the overrides below vanish silently.

overrides:
  # @redocly/openapi-core, reached through openapi-typescript, pins js-yaml 4.3.0, which has two
  # high-severity CPU advisories (GHSA-2v37-7h3g-55p8, fixed in 4.3.1; the merge-key limit, fixed in
  # 4.3.2). 4.3.1 broke redocly at import (`reading 'merge'`) and was reverted; 4.3.2 imports cleanly
  # and `generate:api` emits an identical schema.d.ts. Drop this when redocly moves off 4.3.0.
  "@redocly/openapi-core>js-yaml": 4.3.2
  # openapi-typescript@7.x declares peer typescript@^5.x; this project is on typescript 6. The codegen
  # only uses the TS compiler API to emit .d.ts and works fine on TS 6, so force its peer to ours —
  # otherwise pnpm's autoInstallPeers quietly resolves a second, TS 5 copy for it to run against.
  # Keep this version in step with devDependencies.typescript in package.json; pnpm 11 does not
  # document the `$typescript` back-reference npm supports, so it is spelled out literally.
  openapi-typescript>typescript: ^6.0.3
