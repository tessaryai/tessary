# Opt-in continuous-profiling overlay on docker-compose.dev.yml (`task dev:profiling`), kept separate so
# the normal dev JVM carries no agent. Local Pyroscope UI at http://localhost:4040; the backend pushes
# via Alloy, mirroring production. Nothing leaves the machine.

services:
  pyroscope:
    # No `v` prefix: server tags are plain semver, unlike the Java agent's `v2.8.0` GitHub tags.
    image: grafana/pyroscope:2.2.0
    ports:
      - "127.0.0.1:4040:4040"
    restart: unless-stopped
    networks:
      - tessary

  backend:
    volumes:
      # A directory mount: a missing file mount makes Docker create a directory and the agent load fails opaquely.
      - ./.local/pyroscope:/profiler:ro
    environment:
      # JAVA_TOOL_OPTIONS because the mvn launcher whitespace-splits MAVEN_ARGS. -XX:+DebugNonSafepoints keeps
      # samples on the right frame.
      JAVA_TOOL_OPTIONS: "-javaagent:/profiler/pyroscope.jar -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints"
      PYROSCOPE_AGENT_ENABLED: "true"
      PYROSCOPE_APPLICATION_NAME: tessary-backend
      PYROSCOPE_SERVER_ADDRESS: http://alloy:4040
      PYROSCOPE_PROFILER_EVENT: itimer
      # 512k overruns Pyroscope's 4 MiB decompressed-JFR limit and every upload is rejected with a 422.
      PYROSCOPE_PROFILER_ALLOC: 4m
      PYROSCOPE_FORMAT: jfr
      PYROSCOPE_UPLOAD_INTERVAL: 10s
      PYROSCOPE_LABELS: deployment_environment=development
    depends_on:
      - pyroscope

  alloy:
    environment:
      DEV_PYROSCOPE_ENDPOINT: ${DEV_PYROSCOPE_ENDPOINT:-http://pyroscope:4040}
      # Langfuse stays on; true also ships traces to Grafana Cloud Tempo (see config.dev.alloy).
      DEV_GRAFANA_EXPORT: ${DEV_GRAFANA_EXPORT:-false}
      GRAFANA_CLOUD_TEMPO_URL: ${GRAFANA_CLOUD_TEMPO_URL:-}
      GRAFANA_CLOUD_TEMPO_USERNAME: ${GRAFANA_CLOUD_TEMPO_USERNAME:-}
      GRAFANA_CLOUD_PYROSCOPE_USERNAME: ${GRAFANA_CLOUD_PYROSCOPE_USERNAME:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
