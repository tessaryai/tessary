# Liquibase master changelog.
#
# The schema is defined by a single squashed baseline changeset (0000-baseline.sql, author `evals`),
# folding every prior migration chain into it.
#
# No fold carried its history forward: every database any of these chains had ever touched was
# dropped and recreated on its reset day, so a database of this era has run this one changeset and
# nothing else. There is no conversion path and no straggler accommodation: a database that predates
# the baseline fails its first boot loudly and is recreated, never repaired in place.
#
# New migrations go here in order below the baseline, as changes/NNNN-*.sql under author `evals`,
# numbering from the next free number after the fold (0024).
#
# A reading note for the rest of the repo: comments in Java, Python and shell that cite a migration
# by number ("added by 0072", "as of the teardown (0083)", "dropped by 0016", "removed in 0017")
# mean a chain that no longer exists as files. Every such changeset has been folded into the baseline
# and the numbering restarted, so a future changeset carrying one of those numbers is a different
# migration than the one they name. Not every old citation has a successor file: some named
# changesets were a data-only DELETE or UPDATE, not schema, so a fold left nothing at all to point at.
databaseChangeLog:
  - include:
      file: db/changelog/changes/0000-baseline.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/0024-rca-report-repo-available.sql
      relativeToChangelogFile: false
