# =============================================================================
# Release: publish all four Tessary images (epic 7 clause 1, #941 / #1114)
# =============================================================================
# Generalizes what used to be "Publish Agent Image" (D3 of the internal execution plan, which is
# overlay-owned since #1293 and not part of this repo's public export): that workflow built and
# pushed ONE image (the E2B/Docker agent sandbox). This one builds and pushes all four — backend,
# frontend, sandbox-runner, agent-sandbox — from one version input, and is the only publisher that
# survives the open export (deploy-aws-production.yml, deploy-classify-service.yml and
# reusable-ecs-deploy.yml, which used to be the hosted product's own image builds, moved to
# tessary-paid/ in the same PR that generalized this file — see that plan's divergence log).
#
# Registry: Docker Hub as primary (`tessaryai/tessary`), GHCR as a free mirror
# (`ghcr.io/tessaryai/tessary`) — the repo-wide choice recorded in that same plan (prior-art
# rationale: every comparable self-hosted OSS project checked ships its primary image on Docker
# Hub, and `docker pull org/image` with no registry host resolves to Docker Hub by convention).
# GHCR needs no extra secret: GITHUB_TOKEN with `packages: write` is enough for a same-repo push.
#
# Versioning: SEMVER, not the repo's local short-SHA convention (D2). THE GIT TAG `v<semver>` THIS
# WORKFLOW PUSHES IS THE SINGLE SOURCE OF TRUTH for a published version — there is no VERSION file,
# deliberately. A file could not be read by the two things that consume the version (compose's
# `${VAR:-X}` syntax and a plain JS string literal), so it was never a build input; it was a value
# hand-copied into ~14 places that each had to be remembered on a bump. Now nothing holds a copy:
# the repository's own image defaults float to `-latest`, the published compose artifact is stamped
# with this release's version on the way out (publish-compose below), and
# scripts/check-version-consistency.sh holds that no literal comes back. Taskfile's
# IMAGE_VERSION/IMAGE_REVISION (short SHA / full SHA) are UNCHANGED and still govern local
# `docker compose build`.
#
# The dispatch input is therefore the only place a human types the version, and preflight refuses
# it unless it is well-formed semver and `v<version>` does not already exist — so a release cannot
# silently re-publish a version that was already tagged.
#
# Multi-arch (D4): linux/amd64 + linux/arm64, on NATIVE runners for both (ubuntu-24.04-arm is a
# free GitHub-hosted runner for public repos — no QEMU emulation, which would silently mask a
# non-native-arch RUN step failure, e.g. the groupadd/useradd/apk lines in every runtime stage
# here). Backend and frontend build their architecture-INDEPENDENT artifact (the layered jar's
# bytecode; the Vite bundle's JS) exactly ONCE, in build-artifacts below, and the two per-arch jobs
# for each only build the runtime stage against that artifact — see build-artifacts' own header
# comment for the buildx mechanism that makes this possible with NO Dockerfile changes. sandbox-runner
# and agent-sandbox do NOT get this optimization: re2@1.26.1 is a native addon (built with
# node-gyp/g++ in-image), so a shared, cross-arch artifact would ship the wrong-arch binary — those
# two build their pnpm install/node-gyp step natively on each arch, at the cost of doing it twice.
#
# Publish shape: each per-arch job pushes an intermediate, ARCH-SUFFIXED tag to Docker Hub only
# (e.g. `backend-<version>-amd64`) — a scratch tag nobody is meant to pull directly. merge-and-tag then
# runs `docker buildx imagetools create` twice per service (once per registry; imagetools can copy
# blobs across registries, so the GHCR merge's SOURCES are the Docker-Hub-only arch tags) to
# publish the real multi-arch manifest — `<service>-<version>` and the repointed `<service>-latest`
# alias — to BOTH registries under the SAME tag names. verify-registry-parity is a separate,
# skippable job that then asserts the two registries actually agree, digest for digest: D3's own
# gate requires this be a distinct step that CAN go red, not an assertion true by construction.
#
# THE COMPOSE ARTIFACT (epic 7's one-command install). After the images are merged and tagged, this
# workflow publishes docker-compose.yml itself to BOTH registries as an OCI artifact under
# `compose` and `compose-<version>` — the one-command install the marketing site publishes:
#
#   docker compose -f oci://docker.io/tessaryai/tessary:compose up -d -y
#
# ORDERING IS THE GUARANTEE, and it is why publish-compose `needs: verify-registry-parity` rather
# than running beside the builds: the config is published only after the images it names exist and
# agree across registries, so a `compose` tag can never resolve to a config whose images are not
# there. The reverse staleness — a config OLDER than the images — is impossible by construction,
# because scripts/publish-compose-artifact.sh stamps the file's floating `${TESSARY_VERSION:-latest}`
# defaults with THIS release's version (scripts/lib/pin-compose-version.py) before publishing it —
# so a `compose` tag always carries a config pinned to its own release or newer, and the repository
# file it was made from carries no version at all.
#
# NO IMAGE TAG IS TOUCHED. `compose`/`compose-<version>` collide with neither `<service>-<version>`
# nor `<service>-latest`, and scripts/publish-compose-artifact.sh refuses to write a tag that
# already resolves to something other than a compose artifact. What is published is a
# BUILD-STRIPPED copy of docker-compose.yml, because `docker compose publish` runs `docker push`
# for every service carrying a `build:` block — from this runner, logged in to Docker Hub, that
# would push local images over the manifests merge-and-tag just created.
#
# THE GITHUB RELEASE IS LAST, after the compose artifact, not beside the tag push in merge-and-tag.
# The tag is the source of truth and merge-and-tag pushes it; the Release is the ANNOUNCEMENT, and
# what it announces is the install command. Created next to the tag it could go out while
# publish-compose was still to fail, leaving a published release whose one-liner resolves to
# nothing. Notes are generated server-side by `gh release create --generate-notes`.
#
# NO SIGNING. Cosign / SLSA provenance / SBOM attachment are #1155's (epic 6 clause 4), which is
# CLOSED as NOT_PLANNED (verified 2026-09-05) — this workflow adds none of it and carries no
# `id-token: write`.
#
# Required secrets:
#   DOCKER_USERNAME  - Docker Hub username (for image push from runner)
#   DOCKER_TOKEN     - Docker Hub access token (for image push from runner)
# GHCR uses the built-in GITHUB_TOKEN (permissions.packages: write below).
#
# NO REPO VARIABLE, AND NO SECOND INPUT OF ANY KIND: the dispatch semver is the only thing a human
# supplies. pnpm used to arrive here as a `PNPM_VERSION` Actions variable, which was a THIRD copy
# of a number the tree already states twice — and the only workflow that read it, so nothing else
# going green proved it was set. It now comes from frontend/package.json's `packageManager` field,
# the same source every other workflow's pnpm/action-setup reads and the rule ci.yml's `frontend`
# job states in as many words: don't pin a second one. sandbox-runner/launcher/Dockerfile's own
# ARG default covers the launcher build, and scripts/check-required-inputs.sh already holds every
# such default equal to the Taskfile's pin, so dropping the build-arg removed a source rather than
# adding one.

name: Release

# ALL AUTOMATIC TRIGGERS ARE DISABLED. Nothing in this repository starts a workflow run on its
# own; every workflow here is `workflow_dispatch` only, so runs happen when a human presses Run.
# Re-arming them is tracked as #1184 (epic 11, public repo cutover). The original trigger block
# for this file (generalized from publish-agent-image.yml's single-image `paths:` list) is
# preserved commented-out immediately below — re-enabling is uncommenting it, nothing else.
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'backend/**'
#       - 'frontend/**'
#       - 'sandbox-runner/launcher/**'
#       - 'sandbox-runner/agent-sandbox/**'
#       - 'contract/**'
#       - '.github/workflows/release.yml'
#   workflow_dispatch:
#     inputs:
#       version:
#         description: "Version to publish, SEMVER (e.g. 1.2.0) — becomes the git tag v<version>"
#         required: true
#         type: string

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, SEMVER (e.g. 1.2.0) — becomes the git tag v<version>"
        required: true
        type: string

# ONE RELEASE AT A TIME. Two dispatches in flight would interleave their `imagetools create` calls
# and could leave `<service>-latest` pointing at the older of the two. `cancel-in-progress: false`
# deliberately: a cancelled run has already pushed image tags, and the jobs that verify them are
# the ones that would be cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  DOCKER_REPO: tessaryai/tessary
  GHCR_REPO: ghcr.io/tessaryai/tessary

jobs:
  # ---------------------------------------------------------------------------------------------
  preflight:
    name: Preflight - version + tag checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full tag history to check `v<version>` doesn't already exist

      # The dispatch input is the ONLY place the version is typed; the tag this run pushes is what
      # every consumer afterwards reads. So both gates that used to be spread across a file and a
      # comparison live here: the value must be well-formed, and it must not already be taken.
      - id: check
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "${{ inputs.version }}" | tr -d '[:space:]')"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::inputs.version ('$VERSION') is not a semantic version. Dispatch with e.g. 1.2.0, no leading 'v'." >&2
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::git tag v$VERSION already exists — this version was already released." >&2
            echo "::error::The tag is the source of truth for a published version; dispatch a higher one." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (revision ${{ github.sha }})"

  # ---------------------------------------------------------------------------------------------
  build-artifacts:
    name: Build backend jar + frontend bundle (once, architecture-independent)
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - uses: actions/checkout@v7

      # Backend: run the EXACT steps backend/Dockerfile's own `build` stage runs, in the SAME
      # maven:3.9-eclipse-temurin-25 image, but on the runner rather than inside a build that will
      # be discarded — the whole point is to do this once and hand the result to two arch jobs.
      # Laid out at app/extracted/... and pyroscope.jar at the root to match exactly what
      # backend/Dockerfile's runtime stage's `COPY --from=build /app/extracted/... ` /
      # `COPY --from=build /pyroscope.jar ...` lines expect — see build-backend below for how this
      # directory then STANDS IN for the `build` stage via buildx's `--build-context build=...`.
      #
      # `-P !paid` on BOTH mvn calls (#941/#1114 review): unlike backend/Dockerfile, whose build
      # CONTEXT is `./backend` and so never contains tessary-paid/, this step bind-mounts the FULL
      # checkout. backend/pom.xml's `paid` profile activates on ../tessary-paid/pom.xml merely
      # EXISTING (file-exists activation), so without this flag the reactor would silently pull in
      # every tessary-paid/* module — coupling publication of these four OPEN images to paid-module
      # compile health, with no build-context boundary the way every other open image build gets
      # one structurally. Same flag, same meaning, as check.sh's EDITION_MVN_ARGS and Taskfile's
      # `backend:check:open` (`-P '!paid'`) — D4: the published open image carries only open code.
      - name: Build backend artifact (layered jar + pyroscope agent)
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend-build-context/app
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace/backend \
            maven:3.9-eclipse-temurin-25 \
            sh -c '
              set -eu
              mvn -B -q -P !paid dependency:go-offline
              mvn -B -q -P !paid -DskipTests package
              cp app/target/app-*-exec.jar app.jar
              java -Djarmode=tools -jar app.jar extract --layers --destination extracted
              curl -fsSL -o /workspace/artifacts/backend-build-context/pyroscope.jar \
                "https://github.com/grafana/pyroscope-java/releases/download/v2.8.0/pyroscope.jar"
            '
          cp -r backend/extracted artifacts/backend-build-context/app/extracted

      - name: Build frontend artifact (Vite bundle)
        run: |
          set -euo pipefail
          # The pin comes from the tree, never from a workflow input: `packageManager` is what
          # pnpm/action-setup reads in every other workflow, so this build and CI's cannot drift.
          PNPM="$(jq -r .packageManager frontend/package.json)"
          echo "Building with $PNPM (from frontend/package.json)"
          mkdir -p artifacts/frontend-build-context/app
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PNPM \
            node:24-alpine \
            sh -c '
              set -eu
              npm i -g "$PNPM"
              cd frontend
              pnpm install --frozen-lockfile
              pnpm run build
            '
          cp -r frontend/dist artifacts/frontend-build-context/app/dist

      # THE CONTEXTS TRAVEL AS TARBALLS, and that is load-bearing rather than tidiness:
      # actions/upload-artifact uploads a file list and so DROPS EMPTY DIRECTORIES. backend's
      # runtime stage does `COPY --from=build /app/extracted/spring-boot-loader/ ./` against a
      # directory that IS empty — `extract --layers` ran without `--launcher`, see
      # backend/Dockerfile's own comment on the ENTRYPOINT — so uploaded loose, that directory
      # never comes back down and the COPY fails the build with "not found" on BOTH arches. A tar
      # round-trips the tree exactly: empty directories, modes and all. Unpacked by each build-*
      # job below into the directory its `--build-context build=...` names.
      - name: Pack the build contexts
        run: |
          set -euo pipefail
          tar -C artifacts/backend-build-context -cf backend-build-context.tar .
          tar -C artifacts/frontend-build-context -cf frontend-build-context.tar .

      - uses: actions/upload-artifact@v7
        with:
          name: backend-build-context
          path: backend-build-context.tar
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build-context
          path: frontend-build-context.tar
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  build-backend:
    name: Build backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [preflight, build-artifacts]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: backend-build-context
          path: _artifact

      # See build-artifacts' pack step for why this is a tarball and not a directory.
      - name: Unpack the build context
        run: |
          set -euo pipefail
          mkdir -p backend-build-context
          tar -C backend-build-context -xf _artifact/backend-build-context.tar

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # `--build-context build=./backend-build-context` OVERRIDES the Dockerfile's `FROM
      # maven:3.9-eclipse-temurin-25 AS build` stage with this directory's contents instead of
      # actually running it — buildx substitutes any additional context whose name matches a
      # stage name. `--target runtime` then builds only the runtime stage on top of that. Same
      # Dockerfile as every local/dev build; ZERO Dockerfile changes needed for this to work.
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: backend/Dockerfile
          target: runtime
          build-contexts: |
            build=./backend-build-context
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.revision }}
          push: true
          tags: ${{ env.DOCKER_REPO }}:backend-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=tessary-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tessary-backend-${{ matrix.arch }}

  # ---------------------------------------------------------------------------------------------
  build-frontend:
    name: Build frontend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [preflight, build-artifacts]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-build-context
          path: _artifact

      # See build-artifacts' pack step for why this is a tarball and not a directory.
      - name: Unpack the build context
        run: |
          set -euo pipefail
          mkdir -p frontend-build-context
          tar -C frontend-build-context -xf _artifact/frontend-build-context.tar

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Same build-once mechanism as build-backend above: this context stands in for
      # frontend/Dockerfile's `FROM node:24-alpine AS build` stage.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          build-contexts: |
            build=./frontend-build-context
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.revision }}
          push: true
          tags: ${{ env.DOCKER_REPO }}:frontend-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=tessary-frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tessary-frontend-${{ matrix.arch }}

  # ---------------------------------------------------------------------------------------------
  build-sandbox-runner:
    name: Build sandbox-runner (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # No build-once optimization here (D4): re2@1.26.1 is a native addon compiled by node-gyp in
      # the image, so this pnpm install genuinely happens twice, once per native arch runner.
      - uses: docker/build-push-action@v7
        with:
          context: ./sandbox-runner/launcher
          file: sandbox-runner/launcher/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # No PNPM_VERSION build-arg: this Dockerfile's ARG default IS the pin, and
          # scripts/check-required-inputs.sh holds it equal to the Taskfile's. Passing one here
          # would put a third copy of the number in a workflow input.
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.revision }}
          push: true
          tags: ${{ env.DOCKER_REPO }}:sandbox-runner-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=tessary-sandbox-runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tessary-sandbox-runner-${{ matrix.arch }}

  # ---------------------------------------------------------------------------------------------
  build-agent-sandbox:
    name: Build agent-sandbox (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Same "native per-arch, no shared artifact" reasoning as sandbox-runner above (re2 again).
      # Repo-root context: this Dockerfile's own header requires it (reaches contract/).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox-runner/agent-sandbox/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.revision }}
          push: true
          tags: ${{ env.DOCKER_REPO }}:agent-sandbox-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=tessary-agent-sandbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tessary-agent-sandbox-${{ matrix.arch }}

  # ---------------------------------------------------------------------------------------------
  # Epic 6 clause 3 (#1148): no open artifact reaches a real tag with paid content in it. The four
  # arch-suffixed images above are the artifacts; this job pulls the amd64 build of each and diffs
  # its exported contents against scripts/lib/open-artifact-denylist.txt. It sits BETWEEN the
  # builds and the merge, so a red here leaves only unmerged arch tags behind — nothing a
  # self-hoster's compose file references. A source-tree scrub cannot do this job: a cache layer, a
  # build argument or a longer-lived branch re-including a module is only visible in the image.
  verify-open-artifacts:
    name: Verify the open images carry no paid content (epic 6 clause 3)
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - build-backend
      - build-frontend
      - build-sandbox-runner
      - build-agent-sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Pull the four amd64 images and diff their contents
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          for service in backend frontend sandbox-runner agent-sandbox; do
            docker pull "${{ env.DOCKER_REPO }}:${service}-${VERSION}-amd64"
          done
          bash scripts/check-open-artifacts.sh --images \
            "backend=${{ env.DOCKER_REPO }}:backend-${VERSION}-amd64" \
            "frontend=${{ env.DOCKER_REPO }}:frontend-${VERSION}-amd64" \
            "sandbox-runner=${{ env.DOCKER_REPO }}:sandbox-runner-${VERSION}-amd64" \
            "agent-sandbox=${{ env.DOCKER_REPO }}:agent-sandbox-${VERSION}-amd64"

  # ---------------------------------------------------------------------------------------------
  verify-namespaces:
    name: Verify every published namespace still resolves to tessaryai (epic 6 clause 7)
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-namespaces.sh --negative

  merge-and-tag:
    name: Merge arch manifests, repoint -latest, tag the release
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - build-backend
      - build-frontend
      - build-sandbox-runner
      - build-agent-sandbox
      - verify-open-artifacts
      - verify-namespaces
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker buildx imagetools create` combines the two arch-suffixed images each build-*
      # job pushed into one multi-arch manifest under the real tag — it can copy blobs cross-
      # registry, so the GHCR merge's SOURCES are still the Docker-Hub-only arch tags above; there
      # is no separate GHCR arch build. Run once per service, per registry: four services times
      # two registries times two tags (pinned + -latest) = the sixteen refs below.
      - name: Merge and publish all four images, both registries
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          for service in backend frontend sandbox-runner agent-sandbox; do
            SRC_AMD64="${{ env.DOCKER_REPO }}:${service}-${VERSION}-amd64"
            SRC_ARM64="${{ env.DOCKER_REPO }}:${service}-${VERSION}-arm64"
            for registry_repo in "${{ env.DOCKER_REPO }}" "${{ env.GHCR_REPO }}"; do
              echo "Publishing ${registry_repo}:${service}-${VERSION} (+ -latest)"
              docker buildx imagetools create \
                -t "${registry_repo}:${service}-${VERSION}" \
                -t "${registry_repo}:${service}-latest" \
                "$SRC_AMD64" "$SRC_ARM64"
            done
          done

      - name: Create and push the release tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          git tag "v${VERSION}" "${{ github.sha }}"
          git push origin "v${VERSION}"

  # ---------------------------------------------------------------------------------------------
  # D3 item 7 / D10: a DISTINCT, skippable step that can actually fail — parity guaranteed only by
  # construction (i.e. "the merge job pushed to both, so they must match") is an assertion that
  # can never go red, which is exactly the failure mode this job exists to catch (a partial
  # network failure mid-merge, a registry-side GC race, ...).
  verify-registry-parity:
    name: Verify Docker Hub / GHCR tag parity
    runs-on: ubuntu-24.04
    needs: [preflight, merge-and-tag]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare manifest digests, both tags, all four services
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          fail=0
          for service in backend frontend sandbox-runner agent-sandbox; do
            for tag in "${service}-${VERSION}" "${service}-latest"; do
              hub_digest=$(docker buildx imagetools inspect "${{ env.DOCKER_REPO }}:${tag}" --format '{{json .Manifest.Digest}}')
              ghcr_digest=$(docker buildx imagetools inspect "${{ env.GHCR_REPO }}:${tag}" --format '{{json .Manifest.Digest}}')
              if [ "$hub_digest" != "$ghcr_digest" ]; then
                echo "::error::Digest mismatch for ${tag}: Docker Hub=$hub_digest GHCR=$ghcr_digest" >&2
                fail=1
              else
                echo "OK: ${tag} -> $hub_digest (both registries)"
              fi
            done
          done
          exit "$fail"

  # ---------------------------------------------------------------------------------------------
  publish-compose:
    name: Publish the compose artifact (the one-command install)
    runs-on: ubuntu-24.04
    # AFTER parity, deliberately — see the header. The config must never name images that are not
    # yet published to both registries.
    needs: [preflight, merge-and-tag, verify-registry-parity]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish compose + compose-<version> to both registries
        run: bash scripts/publish-compose-artifact.sh --version=${{ needs.preflight.outputs.version }}

      # The published artifact has to RESOLVE and RENDER for a caller with nothing cloned. Run from
      # an empty directory so a stray repository file cannot make a broken artifact look fine.
      - name: Verify the published artifact renders and pins this release
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          EMPTY="$(mktemp -d)"
          for repo in "${{ env.DOCKER_REPO }}" "${{ env.GHCR_REPO }}"; do
            for tag in compose "compose-${VERSION}"; do
              echo "--- oci://${repo}:${tag}"
              rendered="$(cd "$EMPTY" && docker compose -f "oci://${repo}:${tag}" config)"
              for service in backend frontend sandbox-runner; do
                printf '%s\n' "$rendered" | grep -qF "tessaryai/tessary:${service}-${VERSION}" || {
                  echo "::error::oci://${repo}:${tag} does not pin ${service} to ${VERSION}" >&2; exit 1; }
              done
              printf '%s\n' "$rendered" | grep -E '^ +source: /' | grep -vE 'source: /(var/run/docker.sock|proc|sys)$' && {
                echo "::error::oci://${repo}:${tag} carries a host-path bind" >&2; exit 1; } || true
              echo "OK: ${repo}:${tag} renders, pins ${VERSION}, mounts no host path"
            done
          done

  # ---------------------------------------------------------------------------------------------
  # The announcement, and deliberately the LAST thing that happens — see the header. Runs on its own
  # once every job it needs is green; a red anywhere upstream leaves the Release uncreated, which is
  # the right failure: a tag and some images with no Release is a recoverable state, a Release
  # pointing at a broken install is not.
  github-release:
    name: Publish the GitHub Release
    runs-on: ubuntu-24.04
    needs: [preflight, publish-compose]
    steps:
      # NO CHECKOUT. `gh release create` works over the API against --repo, the tag it names is
      # already on the remote (merge-and-tag pushed it), and --generate-notes builds the changelog
      # server-side from the commits and pull requests since the previous tag — so there is nothing
      # for a clone here to do.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          # A prerelease must not take the `Latest` badge on the repository front page. preflight's
          # regex accepts `1.2.0-rc.1`, so this has to handle it. Build metadata (`1.2.0+abc`) is
          # NOT a prerelease and deliberately does not match.
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --generate-notes \
            $PRERELEASE
          echo "Release v${VERSION} published${PRERELEASE:+ (prerelease)}"
