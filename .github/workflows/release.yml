# Release: the only publisher. Builds the four images (backend, frontend, sandbox-runner, agent-sandbox)
# for linux/amd64 and arm64 on native runners, publishes the E2B agent template (the e2b recipe of the
# same agent runtime) and the docker-compose.yml OCI artifact, all to Docker Hub `tessaryai/tessary`.
#
# Version: the pushed git tag `v<semver>` is the only source of truth; preflight counts it from the
# newest release tag and the dispatched bump, so nobody types it.
#
# Ordering: per-arch builds push by digest (no tag), merge-manifests writes `<service>-<version>`,
# verify-manifests checks both platforms, publish-compose writes `compose-<version>`. Everything up to
# here is additive and cleanup can delete it. finalize is the commit point: it moves the floating
# aliases (`<service>-latest`, `compose`, E2B `latest`/`default`) and pushes the tag, since deleting a
# moved alias is an outage, not a rollback. The GitHub Release comes last.
#
# Secrets: DOCKER_USERNAME (`tessaryai`, an org access token logs in as the org), DOCKER_TOKEN (org
# token with `scope-image-push` and `scope-tag-admin`), E2B_API_KEY (optional: without it the template
# jobs no-op with a warning; gated inside each step because a skipped job skips everything that needs it).
# pnpm comes from frontend/package.json's `packageManager`, never a second pin. No signing.

name: Release

# Dispatch-only; re-arming a push trigger is tracked separately.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the newest release tag to bump"
        required: true
        default: "Patch (x.y.z+1)"
        type: choice
        # Placeholders, not real numbers: a literal here would be a copy of the version.
        options:
          - "Patch (x.y.z+1)"
          - "Minor (x.y+1.0)"
          - "Major (x+1.0.0)"

# One release at a time, so `imagetools create` calls cannot interleave. Not cancel-in-progress: a
# cancelled run has already pushed tags and would skip the jobs that verify them.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOCKER_REPO: tessaryai/tessary

jobs:
  # ---------------------------------------------------------------------------------------------
  preflight:
    name: Preflight - version + tag checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need full tag history to check `v<version>` doesn't already exist

      - id: check
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Release tags only: `-v:refname` ranks `v0.4.0-rc.1` above `v0.4.0`. `|| true` because an empty or
          # SIGPIPE'd grep fails under pipefail; the empty-BASE branch below reports it better.
          BASE="$(git tag --list 'v[0-9]*' --sort=-v:refname \
                    | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [ -z "$BASE" ]; then
            echo "::error::No v<major>.<minor>.<patch> tag exists, so a bump has nothing to count from." >&2
            echo "::error::Tag the first release by hand: git tag v0.1.0 && git push origin v0.1.0" >&2
            exit 1
          fi
          # A counted version never collides, so refuse a commit the base tag already points at; otherwise two
          # presses of Run would ship one commit under two versions.
          if [ "$(git rev-parse "${BASE}^{commit}")" = "${{ github.sha }}" ]; then
            echo "::error::${BASE} already points at ${{ github.sha }}; there is nothing new to release." >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"${BASE#v}"
          # The value arrives as `Patch (x.y.z+1)`; keep the first word, lowercased. `tr` rather than `${BUMP,,}`,
          # which fails on macOS bash 3.2.
          BUMP="$(printf '%s' "${BUMP%% *}" | tr '[:upper:]' '[:lower:]')"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'; expected major, minor or patch." >&2; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "${BASE} -> v${VERSION} (${BUMP} bump, revision ${{ github.sha }})" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  build-backend:
    name: Build backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: backend/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.revision }}
          # By digest with no tag: an arch-suffixed tag would be a public single-arch image.
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tessary-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tessary-backend-${{ matrix.arch }}

      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          printf '%s' "${{ steps.build.outputs.digest }}" \
            > "${{ runner.temp }}/digests/backend-${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-backend-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/backend-${{ matrix.arch }}
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  build-frontend:
    name: Build frontend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Repo-root context because the build stage COPYs `frontend/...`. No PNPM_VERSION build-arg: the
      # Dockerfile's ARG default is the pin.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.revision }}
          # By digest with no tag: an arch-suffixed tag would be a public single-arch image.
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tessary-frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tessary-frontend-${{ matrix.arch }}

      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          printf '%s' "${{ steps.build.outputs.digest }}" \
            > "${{ runner.temp }}/digests/frontend-${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-frontend-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/frontend-${{ matrix.arch }}
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  build-sandbox-runner:
    name: Build sandbox-runner (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./sandbox-runner/launcher
          file: sandbox-runner/launcher/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # No PNPM_VERSION build-arg: the Dockerfile's ARG default is the pin.
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.revision }}
          # By digest with no tag: an arch-suffixed tag would be a public single-arch image.
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tessary-sandbox-runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tessary-sandbox-runner-${{ matrix.arch }}

      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          printf '%s' "${{ steps.build.outputs.digest }}" \
            > "${{ runner.temp }}/digests/sandbox-runner-${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-sandbox-runner-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/sandbox-runner-${{ matrix.arch }}
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  build-agent-sandbox:
    name: Build agent-sandbox (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Repo-root context: this Dockerfile's header requires it.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sandbox-runner/agent-sandbox/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.revision }}
          # By digest with no tag: an arch-suffixed tag would be a public single-arch image.
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tessary-agent-sandbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tessary-agent-sandbox-${{ matrix.arch }}

      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          printf '%s' "${{ steps.build.outputs.digest }}" \
            > "${{ runner.temp }}/digests/agent-sandbox-${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-agent-sandbox-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/agent-sandbox-${{ matrix.arch }}
          retention-days: 1

  # |  # ---------------------------------------------------------------------------------------------
  # Additive like every job before finalize: writes `<version>` and `recipe-<hash>`, never `latest` or
  # `default`. build.ts hashes the real build inputs, so E2B (not a git diff) answers whether to rebuild;
  # a diff would skip the rebuild after a failed template release.
  build-agent-template:
    name: Build the E2B agent template
    runs-on: ubuntu-24.04
    needs: preflight
    outputs:
      rebuilt: ${{ steps.release.outputs.rebuilt }}
      recipe: ${{ steps.release.outputs.recipe }}
      build_id: ${{ steps.release.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Must precede setup-node: its `cache: pnpm` shells out to pnpm.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sandbox-runner/agent-sandbox/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sandbox-runner/agent-sandbox/pnpm-lock.yaml
      # --ignore-scripts: the manifest carries re2, whose install runs node-gyp; build.ts needs only e2b and tsx.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: sandbox-runner/agent-sandbox

      - id: release
        working-directory: sandbox-runner/agent-sandbox
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${E2B_API_KEY:-}" ]; then
            echo "::warning::E2B_API_KEY is not set, so the E2B template lane is skipped. The four" \
                 "images still publish; SANDBOX_BACKEND=e2b installs keep resolving the previous build."
            exit 0
          fi
          pnpm exec tsx build.ts --release="${{ needs.preflight.outputs.version }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # |  # ---------------------------------------------------------------------------------------------
  # Boots the tagged template and runs commands through it, since a template can build cleanly and then
  # fail every run (no bash on Alpine, runCmd not root). Runs on the dedup path too. Also asserts the
  # template is still public under `tessary/tessary-agent-sandbox`.
  verify-agent-template:
    name: Boot the E2B template and prove it runs
    runs-on: ubuntu-24.04
    needs: [preflight, build-agent-template]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sandbox-runner/agent-sandbox/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sandbox-runner/agent-sandbox/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: sandbox-runner/agent-sandbox

      - working-directory: sandbox-runner/agent-sandbox
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${E2B_API_KEY:-}" ]; then
            echo "::warning::E2B_API_KEY is not set; nothing was published to E2B, so there is nothing to verify."
            exit 0
          fi
          pnpm exec tsx build.ts --verify="${{ needs.preflight.outputs.version }}"

  # |  # ---------------------------------------------------------------------------------------------
  # Diffs each image's exported contents against scripts/lib/open-artifact-denylist.txt before anything is
  # merged. Each arch runs on its own runner, so check-open-artifacts.sh needs no --platform.
  verify-open-artifacts:
    name: Verify the open images carry no paid content (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - preflight
      - build-backend
      - build-frontend
      - build-sandbox-runner
      - build-agent-sandbox
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*-${{ matrix.arch }}
          path: digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # By digest, since the builds write no tag. The script takes <role>=<ref> pairs.
      - name: Pull this arch's four images by digest and diff their contents
        run: |
          set -euo pipefail
          REPO="${{ env.DOCKER_REPO }}"
          ARCH="${{ matrix.arch }}"
          refs=()
          for service in backend frontend sandbox-runner agent-sandbox; do
            ref="${REPO}@$(cat "digests/${service}-${ARCH}")"
            docker pull "$ref"
            refs+=("${service}=${ref}")
          done
          bash scripts/check-open-artifacts.sh --images "${refs[@]}"

  merge-manifests:
    name: Merge the arch manifests into <service>-<version>
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - build-backend
      - build-frontend
      - build-sandbox-runner
      - build-agent-sandbox
      - verify-open-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Version tags only; `-latest` is finalize's.
      - name: Merge all four images into <service>-<version>
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          REPO="${{ env.DOCKER_REPO }}"
          for service in backend frontend sandbox-runner agent-sandbox; do
            echo "Publishing ${REPO}:${service}-${VERSION}"
            docker buildx imagetools create \
              -t "${REPO}:${service}-${VERSION}" \
              "${REPO}@$(cat "digests/${service}-amd64")" \
              "${REPO}@$(cat "digests/${service}-arm64")"
          done

  # |  # ---------------------------------------------------------------------------------------------
  # A step that can go red: asks the registry whether every tag just written resolves with both platforms.
  verify-manifests:
    name: Verify every published manifest resolves and is multi-arch
    runs-on: ubuntu-24.04
    needs: [preflight, merge-manifests]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Inspect all four manifests
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          fail=0
          for service in backend frontend sandbox-runner agent-sandbox; do
            ref="${{ env.DOCKER_REPO }}:${service}-${VERSION}"
            if ! platforms="$(docker buildx imagetools inspect "$ref" \
                                --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"; then
              echo "::error::${ref} does not resolve" >&2; fail=1; continue
            fi
            for want in linux/amd64 linux/arm64; do
              case " $platforms " in
                *" $want "*) ;;
                *) echo "::error::${ref} is missing ${want} (has: ${platforms})" >&2; fail=1 ;;
              esac
            done
            echo "OK: ${ref} -> ${platforms}"
          done
          exit "$fail"

  # ---------------------------------------------------------------------------------------------
  publish-compose:
    name: Publish the compose artifact (the one-command install)
    runs-on: ubuntu-24.04
    # The pinned tag only, before finalize, so publishing is proven while still reversible. Needs
    # verify-agent-template because the published config pins the template's `<version>` tag.
    needs: [preflight, merge-manifests, verify-manifests, verify-agent-template]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Checksum-verified, since this binary is handed registry credentials. See
      # scripts/publish-compose-artifact.sh for why it is not `docker compose publish`.
      - name: Install oras
        run: |
          set -euo pipefail
          bash scripts/lib/install-oras.sh "$RUNNER_TEMP/oras-bin" >/dev/null
          printf '%s\n' "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"

      - name: Publish compose-<version>
        run: |
          bash scripts/publish-compose-artifact.sh \
            --repo=docker.io/${{ env.DOCKER_REPO }} \
            --version=${{ needs.preflight.outputs.version }} \
            --tags=pinned

      # From an empty directory so a stray repository file cannot make a broken artifact look fine.
      - name: Verify the published artifact renders and pins this release
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          EMPTY="$(mktemp -d)"
          # `docker.io/` spelled out: the exact string the site publishes.
          for repo in "docker.io/${{ env.DOCKER_REPO }}"; do
            for tag in "compose-${VERSION}"; do
              echo "--- oci://${repo}:${tag}"
              rendered="$(cd "$EMPTY" && docker compose -f "oci://${repo}:${tag}" config)"
              for service in backend frontend sandbox-runner; do
                printf '%s\n' "$rendered" | grep -qF "tessaryai/tessary:${service}-${VERSION}" || {
                  echo "::error::oci://${repo}:${tag} does not pin ${service} to ${VERSION}" >&2; exit 1; }
              done
              # The E2B template is the only pinned reference that is not a docker ref.
              printf '%s\n' "$rendered" | grep -qF "tessary/tessary-agent-sandbox:${VERSION}" || {
                echo "::error::oci://${repo}:${tag} does not pin the E2B template to ${VERSION}" >&2; exit 1; }
              printf '%s\n' "$rendered" | grep -E '^ +source: /' | grep -vE 'source: /(var/run/docker.sock|proc|sys)$' && {
                echo "::error::oci://${repo}:${tag} carries a host-path bind" >&2; exit 1; } || true
              echo "OK: ${repo}:${tag} renders, pins ${VERSION}, mounts no host path"
            done
          done

  # |  # ---------------------------------------------------------------------------------------------
  # The point of no return: moves the floating aliases and pushes `v<version>`. Neither is undoable by
  # cleanup, so both wait until every image exists, resolves and carries both arches.
  finalize:
    name: Repoint -latest and compose, push the release tag
    runs-on: ubuntu-24.04
    needs: [preflight, merge-manifests, verify-manifests, verify-agent-template, publish-compose]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # From the merged manifest, so `-latest` and `<service>-<version>` are the same digest.
      - name: Repoint <service>-latest
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          for service in backend frontend sandbox-runner agent-sandbox; do
            echo "Repointing ${{ env.DOCKER_REPO }}:${service}-latest -> ${service}-${VERSION}"
            docker buildx imagetools create \
              -t "${{ env.DOCKER_REPO }}:${service}-latest" \
              "${{ env.DOCKER_REPO }}:${service}-${VERSION}"
          done

      # E2B's `latest` (what the compose default resolves to) and `default` (what a bare template name means)
      # move together onto the build that was verified.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sandbox-runner/agent-sandbox/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sandbox-runner/agent-sandbox/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: sandbox-runner/agent-sandbox
      - name: Repoint the E2B template's latest and default tags
        working-directory: sandbox-runner/agent-sandbox
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${E2B_API_KEY:-}" ]; then
            echo "::warning::E2B_API_KEY is not set; nothing was published to E2B, so there is nothing to repoint."
            exit 0
          fi
          pnpm exec tsx build.ts --promote="${{ needs.preflight.outputs.version }}"

      # publish-compose already proved the identical file renders. Checksum-verified oras, since it is handed
      # registry credentials.
      - name: Install oras
        run: |
          set -euo pipefail
          bash scripts/lib/install-oras.sh "$RUNNER_TEMP/oras-bin" >/dev/null
          printf '%s\n' "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"

      - name: Repoint the floating compose tag
        run: |
          bash scripts/publish-compose-artifact.sh \
            --repo=docker.io/${{ env.DOCKER_REPO }} \
            --version=${{ needs.preflight.outputs.version }} \
            --tags=floating

      - name: Verify oci://...:compose renders and pins this release
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          REF="oci://docker.io/${{ env.DOCKER_REPO }}:compose"
          EMPTY="$(mktemp -d)"
          rendered="$(cd "$EMPTY" && docker compose -f "$REF" config)"
          for service in backend frontend sandbox-runner agent-sandbox; do
            printf '%s\n' "$rendered" | grep -qF "tessaryai/tessary:${service}-${VERSION}" || {
              echo "::error::${REF} does not pin ${service} to ${VERSION}" >&2; exit 1; }
          done
          printf '%s\n' "$rendered" | grep -qF "tessary/tessary-agent-sandbox:${VERSION}" || {
            echo "::error::${REF} does not pin the E2B template to ${VERSION}" >&2; exit 1; }
          echo "OK: ${REF} renders and pins ${VERSION}"

      - name: Create and push the release tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          git tag "v${VERSION}" "${{ github.sha }}"
          git push origin "v${VERSION}"

  # |  # ---------------------------------------------------------------------------------------------
  # Last: a tag and images with no Release is recoverable; a Release pointing at a broken install is not.
  github-release:
    name: Publish the GitHub Release
    runs-on: ubuntu-24.04
    needs: [preflight, finalize]
    steps:
      # No checkout: finalize already pushed the tag and --generate-notes works server-side.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --generate-notes
          echo "Release v${VERSION} published"

  # |  # ---------------------------------------------------------------------------------------------
  # Publishes packages/mcp/package.json's own version, not this release's. Gated on finalize; npm has no
  # in-place update, so a failure here is fixed by hand.
  publish-mcp-package:
    name: Publish @tessaryai/mcp to npm
    runs-on: ubuntu-24.04
    needs: [preflight, finalize]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Warn and exit clean until NPM_TOKEN exists.
      - name: Check for NPM_TOKEN
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not set; @tessaryai/mcp was not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Zero runtime dependencies, so there is nothing to install.
      - name: Run the package's own tests
        if: steps.gate.outputs.publish == 'true'
        working-directory: packages/mcp
        run: npm test

      # Idempotent: most releases find the version already on npm and skip.
      - name: Publish if this version isn't on npm yet
        if: steps.gate.outputs.publish == 'true'
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published; nothing to do."
            exit 0
          fi
          npm publish --access public
          echo "Published ${NAME}@${VERSION}"

  # |  # ---------------------------------------------------------------------------------------------
  # Rollback, only when finalize did not run: removes `<service>-<version>` and `compose-<version>`. After
  # finalize every tag stays, since `-latest` and the compose artifact name them. Never fatal. Only the
  # namespaced Docker Hub API accepts an org token (`/v2/auth/token`, then `/v2/namespaces/.../tags/{tag}`).
  cleanup:
    name: Roll back this run's tags
    runs-on: ubuntu-24.04
    if: ${{ always() && needs.finalize.result != 'success' }}
    needs:
      - preflight
      - build-backend
      - build-frontend
      - build-sandbox-runner
      - build-agent-sandbox
      - build-agent-template
      - verify-agent-template
      - verify-open-artifacts
      - merge-manifests
      - verify-manifests
      - publish-compose
      - finalize
      - github-release
    steps:
      - name: Delete the tags this run created
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "preflight never produced a version; nothing was created, nothing to remove."
            exit 0
          fi
          echo "finalize did not succeed (${FINALIZE_RESULT}); nothing downstream can be holding a"
          echo "reference, so this run's version-scoped tags go."
          tags=()
          for service in backend frontend sandbox-runner agent-sandbox; do
            tags+=("${service}-${VERSION}")
          done
          tags+=("compose-${VERSION}")

          # jq builds the body so neither credential is ever spliced into JSON by the shell.
          bearer="$(curl -sf -H 'Content-Type: application/json' \
                   -d "$(jq -nc --arg u "$DOCKER_USERNAME" --arg p "$DOCKER_TOKEN" \
                           '{identifier:$u,secret:$p}')" \
                   https://hub.docker.com/v2/auth/token | jq -r '.access_token // empty')" || bearer=""
          if [ -z "$bearer" ]; then
            echo "::warning::could not authenticate to the Docker Hub API; ${#tags[@]} tag(s) left in place"
            exit 0
          fi

          namespace="${DOCKER_REPO%%/*}"
          repository="${DOCKER_REPO#*/}"
          for tag in "${tags[@]}"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $bearer" \
              "https://hub.docker.com/v2/namespaces/${namespace}/repositories/${repository}/tags/${tag}")"
            case "$code" in
              20*) echo "deleted  ${tag}" ;;
              404) echo "absent   ${tag}" ;;
              *)   echo "::warning::could not delete ${tag} (HTTP ${code}; a token without scope-tag-admin answers 403)" ;;
            esac
          done

      # Curl rather than a toolchain setup, so cleanup cannot fail in a new way. `recipe-<hash>` stays: it
      # names a build by content and lets the next attempt skip the rebuild.
      - name: Remove the E2B version tag this run created
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${E2B_API_KEY:-}" ] || [ -z "$VERSION" ]; then
            echo "no E2B key or no version; nothing was tagged on E2B, nothing to remove."
            exit 0
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -H "X-API-KEY: $E2B_API_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg v "$VERSION" '{name:"tessary-agent-sandbox",tags:[$v]}')" \
            https://api.e2b.dev/templates/tags)"
          case "$code" in
            20*) echo "deleted  e2b tag ${VERSION}" ;;
            404) echo "absent   e2b tag ${VERSION}" ;;
            *)   echo "::warning::could not delete the E2B tag ${VERSION} (HTTP ${code})" ;;
          esac
