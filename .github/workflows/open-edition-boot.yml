name: Open edition boot check

# THE DETACHED OPEN-EDITION BOOT CHECK (#849 AC4), DELIBERATELY DISPATCH-ONLY.
#
# This workflow is authored and fully wired — it runs scripts/check-open-boot.sh (#849 AC4) on a
# real, Docker-capable runner right now, on demand from the Actions tab — but it is deliberately
# NOT on an automatic trigger. That is a decision, not an oversight:
#
#   Decision-maker's words, verbatim: "Add the CI check but don't enable it per PR, note it down
#   somewhere, we will enable it later once we get more CI minutes."
#
# The reason is conserving this repo's free-tier GitHub Actions minutes. Neither of the two
# obvious homes for this job would have honoured that: appending it to open-edition.yml's job list
# would put it on every `pull_request`, and appending it to ci.yml's weekly cron consumes the same
# free-tier minutes the decision is conserving (`on:` is file-level, so a job added to either
# existing file inherits that file's trigger whether wanted or not). Hence a THIRD, separate
# workflow file with `on: workflow_dispatch` only — no `schedule:`, no `pull_request:` — that costs
# zero minutes until a human presses the button.
#
# THE EPIC-1 GATE'S BOOT CLAUSE (the internal execution plan: "a detached `task dev:up:slim`
# must BOOT") IS
# THEREFORE STILL NOT CONTINUOUSLY ENFORCED. This job proves the instrument works when someone
# runs it; it does not run itself. Until it is turned on, that clause rests on manual dispatch of
# this workflow, `task check:open:boot` run locally, or the one-time human measurement already on
# file (#886, landing commit ef0500ad). See the divergence log dated 2026-08-31 in the internal
# execution plan (overlay-owned since #1293, not part of this repo's public export) for the
# matching ledger entry — it is recorded there as an OPEN item, to be re-checked at the epic 11
# cutover, not a closed one.
#
# THE EXACT ONE-LINE CHANGE THAT ENABLES IT: add `pull_request:` under `on:` below, e.g.
#
#   on:
#     pull_request:
#     workflow_dispatch:
#
# (the same two-key shape open-edition.yml already uses). Do that once there are enough CI minutes
# to afford a Docker-capable runner on every PR, and delete this comment block down to the ledger
# reference above. Nothing else in this file needs to change to go from dispatch-only to per-PR.
on:
  workflow_dispatch:

jobs:
  open-edition-boot:
    name: Detached open-edition boot (clean-room export, tessary-paid/ stripped, authenticated triage)
    # The one job in this repo's CI that genuinely needs Docker: it builds and starts the real
    # slim dev stack (postgres, backend, frontend, caddy, slack, classify) inside a clean-room
    # export of the working tree with tessary-paid/ removed (scripts/lib/export-simulate.sh's
    # copy + `git init` recipe, #889 — NOT `git archive`, which only ever materializes the last
    # commit and would silently miss an uncommitted boundary violation). alloy is NOT part of the
    # default slim stack any more (#864 — profiles: ["observability"], off by default).
    # ubuntu-latest ships Docker and Compose preinstalled — no extra setup step, unlike every
    # toolchain open-edition.yml assembles by hand for its non-Docker gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone: export-simulate.sh copies the WORKING
          # TREE (tracked files as they sit on disk, staged or not, plus untracked-but-not-ignored
          # files), not a specific commit, so a shallow checkout would already satisfy it — but
          # there is no reason to rely on that staying true, and a full checkout costs nothing
          # extra on a job that is already building and booting a whole stack.
          fetch-depth: 0

      # The one piece of toolchain assembly this job needs beyond ubuntu-latest's preinstalled
      # git/docker/docker-compose/curl/jq: `uv`, for step (f) of check-open-boot.sh's
      # authenticated-triage assertion (classifiers/data_gen/emit_local.py, run via `uv run`,
      # same convention as open-edition.yml's classifier-parity job). No committed
      # classifiers/.venv to rely on — classifiers/.gitignore excludes it, so it never survives a
      # fresh checkout; `uv run --extra otlp` resolves classifiers/pyproject.toml +
      # classifiers/uv.lock and builds one on demand.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: classifiers/uv.lock

      - name: Run the detached open-edition boot check
        # No secret here on purpose: no test or check may require a real credential, local or CI
        # (#852/#996 rule). The BYO-provider-credential step inside the script uses a clearly-fake
        # placeholder, which proves the seal + read-back path — all it can prove, since the open
        # edition has no model-graded classifier to consume a key.
        run: bash scripts/check-open-boot.sh

  open-edition-boot-selfhost:
    name: Detached open-edition boot, self-host artifact (docker-compose.yml, production profile)
    # The gate's second leg (#1052), a separate job so it runs IN PARALLEL with the dev leg above
    # and its ~9 minutes of build+boot are not serialised behind it. It boots docker-compose.yml —
    # the file a self-hoster actually runs, which no check had ever booted before #1052 — with
    # SPRING_PROFILES_ACTIVE left at that file's production default, the real backend/Dockerfile
    # and frontend/Dockerfile, sandbox-runner started unconditionally on the docker sandbox default,
    # and only four generated run-scoped values in the environment. Boot + production auth guard +
    # credential deny-list; the authenticated triage flow stays the dev leg's job (same backend
    # image contents, so proving it twice buys nothing). No uv needed: this leg emits no canary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the published images resolve BEFORE the boot clock starts (D10, #941/#1114)
        # scripts/check-selfhost-images.sh — no registry login. Runs first, deliberately: a broken
        # or unpublished image tag should fail here, in seconds, as "image unresolvable" — not
        # several minutes into `docker compose up -d --build` as an opaque `manifest unknown` (the
        # #1114 failure this whole clause exists to catch). Until the first tessaryai/tessary
        # release is published (D9's accepted consequence — see the internal execution plan), this step is
        # EXPECTED to fail; it is not yet wired to gate the job (continue-on-error) for that reason
        # alone, and that line should come out the moment the first release ships.
        continue-on-error: true
        run: bash scripts/check-selfhost-images.sh

      - name: Run the detached self-host boot check
        # No secret here either — same #852/#996 rule as the job above. The four values the script
        # mints (postgres user/password, TESSARY_SECRET_KEY, TESSARY_AUTH_COOKIE_PASSWORD) are
        # openssl-random and die with the job.
        run: bash scripts/check-open-boot-selfhost.sh
      - name: Prove the readiness signal can fail (epic 7 clause 4, #1189)
        run: bash scripts/check-open-boot-selfhost.sh --negative-health
      - name: Boot on a custom domain (epic 8 Track B, #1225)
        run: bash scripts/check-open-boot-selfhost.sh --domain
      - name: Boot with the bundled Redpanda under the kafka profile (epic 8 Track B, #984)
        run: bash scripts/check-open-boot-selfhost.sh --kafka

  open-edition-quickstart-rehearsal:
    name: Self-host quickstart rehearsal (epic 7 clause 2, #1191; clauses 3 and 5)
    # The outsider's run, mechanised (R1): setup.mdx's own command blocks, verbatim, from the
    # published inputs and nothing else, on the compose defaults. Dispatch-only like every job in
    # this file; #1184 owns re-arming. `--build` stands in for the page's `docker compose pull`
    # until the first tessaryai/tessary release publishes every image the compose names; the step
    # below says so and the clock line it prints is recorded as built, not pulled. Drop the flag
    # the day check-selfhost-images.sh goes green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rehearse the documented quickstart (built, not pulled, until the images publish)
        run: bash scripts/check-selfhost-quickstart.sh --build

  open-edition-zero-egress:
    name: Zero-egress with the opt-out set (epic 7 clause 9, #1197)
    # The quickstart rehearsal again, on an internal network with a DNS sink and the heartbeat off,
    # holding the stack to the permitted set the configuration page publishes; then the heartbeat as
    # the positive control and a planted call, so a green run is known to be able to go red.
    # Dispatch-only; #1184 owns re-arming. `--build` comes off with the rehearsal's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Boot on a network with no way out, rehearse, and watch the sink
        run: bash scripts/check-zero-egress.sh --build

  open-edition-exposure-sweep:
    name: Fresh-deployment exposure sweep (epic 6 clause 8, #1153)
    # The third leg, a separate job so its own boot runs in parallel with the two above. Boots the
    # same self-host artifact the second leg does, keyless under the production profile, then attacks
    # it: every spec operation unauthenticated, default credentials, the served bundle, SSRF and
    # traversal against a listener on the stack network, and a two-tenant substitution sweep. Green
    # is a listed result set (scripts/lib/exposure-sweep-baseline.txt is the recorded one; a run
    # names every probe whose status moved), red is a finding. Epic 7's #1198 re-runs this job,
    # unmodified, against the published images. No secret: the two accounts it creates are its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run the exposure sweep
        run: bash scripts/check-exposure-sweep.sh

  open-edition-compose-artifact:
    name: The one-command install, end to end (epic 7's one-command install)
    # The fourth leg, and the only one that exercises what tessary.ai's hero actually tells people
    # to run. It publishes docker-compose.yml to a throwaway TLS registry on the runner, then runs
    # `docker compose -f oci://.../tessary:compose up -d -y` from an EMPTY directory — no clone, no
    # .env, no build context — and asserts the stack comes up healthy, pins this release's image
    # tags, mounts no host path, leaves the working directory empty, and tears down clean.
    # Parallel with the three legs above; own runner, own registry, own Compose project name.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run the compose-artifact rehearsal
        run: bash scripts/check-selfhost-compose-artifact.sh
