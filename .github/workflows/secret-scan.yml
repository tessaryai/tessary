# The OPEN tree's own secret scan (#1293, C5). gitleaks in filesystem mode over this checkout,
# through the repo-root .gitleaks.toml and nothing else.
#
# WHY THIS FILE EXISTS. Until #1293 the public tree shipped scripts/check-scrub.sh, and that script
# read scripts/lib/export-forbidden-strings.txt — a file the export deleted by design. So in the
# published repo the gate returned success before touching a scanner: a permanently green no-op
# whose greenness said nothing at all. #1293 moved that script and its input into the overlay
# together, where they can do their real job against the export candidate, and put THIS in the
# public tree instead. The difference that matters is the failure mode. This workflow HARD-FAILS
# when the scanner is missing or errors; the thing it replaced returned zero when its input was
# missing. A gate that goes green on absence is worse than no gate, because it is counted.
#
# NO PRIVATE CONFIGURATION REACHES THIS RUN. It scans its own checkout through .gitleaks.toml: the
# stock gitleaks rule set, the five self-minted formats in scripts/lib/gitleaks-self-minted.toml,
# and the fifteen reviewed exemptions. Every one of those files is open and publishes, so nothing
# private is read. What it does NOT run is the forbidden-content sweep, and that one really cannot
# publish: it is a list of specific secrets rather than of shapes, so it stays overlay-owned.
#
# The self-minted rules were left out of an earlier revision on the same "cannot publish" ground,
# which was wrong — #1293's review corrected it. Nothing in the stock rule set matches `tsy_w_…` or
# `link_…`, so without them a live platform key committed here scans green, and the overlay's scrub
# gate would not see it until its own next run. Two scans with different SUBJECTS (this checkout vs
# the export candidate) and different DEPTHS (shape rules vs shape rules plus named strings), not
# one scan split in half.
name: secret-scan

# ALL AUTOMATIC TRIGGERS ARE DISABLED. Nothing in this repository starts a workflow run on its
# own; every workflow here is `workflow_dispatch` only, so runs happen when a human presses Run.
# Re-arming them is tracked as #1184 (epic 11, public repo cutover). This file is BORN dispatch-only
# rather than arriving armed and being disarmed — section G of #1293 is readiness only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: this checkout carries no secret (gitleaks, filesystem mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same version the overlay's scrub gate pins, so a finding here and a finding
      # there are the same detector's opinion. That script cannot be READ from here — it is not in
      # the public repo — so the number is a literal, and this comment is the only thing tying the
      # two together. If one moves, move the other: tessary-paid/scripts/check-scrub.sh's
      # GITLEAKS_VERSION.
      - name: install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The honest inversion of what this replaced. scripts/check-scrub.sh returned 0 when its
      # scan configuration was absent; this returns 1 when its SCANNER is absent. Same branch shape
      # as that script's `[ -n "${CI:-}" ]` arm — missing binary is a job bug, and a job bug in a
      # security gate is a failure, never a skip.
      - name: the scanner must actually be here
        run: |
          set -euo pipefail
          if ! command -v gitleaks >/dev/null 2>&1; then
            echo "secret-scan: FAIL, gitleaks is not on PATH after the install step." >&2
            echo "  This check is the entire point of the run; an absent scanner is a failure, not a skip." >&2
            exit 1
          fi
          [ -f .gitleaks.toml ] || {
            echo "secret-scan: FAIL, .gitleaks.toml is missing. Without it this run would apply no" >&2
            echo "  exemptions and every reviewed fixture would re-fire — a red run nobody can act on." >&2
            exit 1
          }

      # `detect --no-git`: this repo has a real history, but the subject here is the WORKING TREE —
      # what a reader of the public repo can see today. A git-mode scan would also walk commits that
      # D3 says cannot reach the public tree (it starts at commit one), which is the same reason the
      # overlay's gate scans filesystem-mode too.
      #
      # `--exit-code 1` is explicit rather than relied upon: gitleaks' default is already 1, and
      # naming it here means a future default change cannot silently turn findings into a green run.
      # `--redact` so the log names the file and rule without reprinting the value.
      - name: gitleaks (filesystem mode, repo-root config)
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --verbose

      # Kept even on failure: the SARIF is how a finding gets triaged without re-running the scan,
      # and --redact means it carries the location and rule id, not the value.
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn
