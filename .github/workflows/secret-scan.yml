# This repo's secret scan: gitleaks in filesystem mode over the checkout, through the repo-root
# .gitleaks.toml and nothing else.
#
# It scans only what ships here: the stock gitleaks rule set, the self-minted formats in
# scripts/lib/gitleaks-self-minted.toml, and the reviewed exemptions in .gitleaks.toml. This
# workflow hard-fails when the scanner or its config is missing, rather than treating an absent
# input as a pass. A gate that goes green on absence is worse than no gate, because it is counted.
name: secret-scan

# All triggers are manual: every workflow here is `workflow_dispatch` only, so a run starts when a
# human presses Run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: this checkout carries no secret (gitleaks, filesystem mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than left to float, so a finding here is reproducible across runs.
      - name: install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # A missing binary is a job bug, and a job bug in a security gate is a failure, never a skip.
      - name: the scanner must actually be here
        run: |
          set -euo pipefail
          if ! command -v gitleaks >/dev/null 2>&1; then
            echo "secret-scan: FAIL, gitleaks is not on PATH after the install step." >&2
            echo "  This check is the entire point of the run; an absent scanner is a failure, not a skip." >&2
            exit 1
          fi
          [ -f .gitleaks.toml ] || {
            echo "secret-scan: FAIL, .gitleaks.toml is missing. Without it this run would apply no" >&2
            echo "  exemptions and every reviewed fixture would re-fire — a red run nobody can act on." >&2
            exit 1
          }

      # `detect --no-git`: scans the working tree, what a reader of this repo can see today, not
      # the full commit history.
      #
      # `--exit-code 1` is explicit rather than relied upon, so a future gitleaks default change
      # can't silently turn findings into a green run. `--redact` logs the file and rule, not the
      # value.
      - name: gitleaks (filesystem mode, repo-root config)
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --verbose

      # Kept even on failure: the SARIF is how a finding gets triaged without re-running the scan,
      # and --redact means it carries the location and rule id, not the value.
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn
