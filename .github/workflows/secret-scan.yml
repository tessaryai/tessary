# gitleaks in filesystem mode through the repo-root .gitleaks.toml (which pulls in
# scripts/lib/gitleaks-self-minted.toml). A missing scanner or config fails; a gate green on absence is worse than none.
name: secret-scan

on:
  pull_request:
  workflow_dispatch:

# One run per PR. Cancel-in-progress, unlike release.yml: a superseded check is waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: this checkout carries no secret (gitleaks, filesystem mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned so a finding is reproducible across runs.
      - name: install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # A missing binary in a security gate is a failure, never a skip.
      - name: the scanner must actually be here
        run: |
          set -euo pipefail
          if ! command -v gitleaks >/dev/null 2>&1; then
            echo "secret-scan: FAIL, gitleaks is not on PATH after the install step." >&2
            echo "  This check is the entire point of the run; an absent scanner is a failure, not a skip." >&2
            exit 1
          fi
          [ -f .gitleaks.toml ] || {
            echo "secret-scan: FAIL, .gitleaks.toml is missing. Without it this run would apply no" >&2
            echo "  exemptions and every reviewed fixture would re-fire — a red run nobody can act on." >&2
            exit 1
          }

      # Scans the working tree, not history. `--exit-code 1` is explicit against a default change; `--redact`
      # logs the file and rule, not the value.
      - name: gitleaks (filesystem mode, repo-root config)
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --verbose

      # Kept on failure so a finding can be triaged without re-running; redacted.
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn
