name: CodeQL

# Weekly and on demand. Free here because the repository is public. java-kotlin's `build-mode: none`
# skips Kotlin sources; the reactor has none.

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL analyze (${{ matrix.language }})
    # The private paid copy syncs this file but has no free code scanning.
    if: github.repository == 'tessaryai/tessary'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
