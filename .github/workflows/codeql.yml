name: CodeQL

# AUTHORED BUT NOT ARMED — for a LICENSING reason, not a CI-minutes one, in contrast to every
# other dispatch-only workflow in this directory.
#
# Measured 2026-09-01, verbatim:
#   $ gh api orgs/tessaryai --jq .plan.name
#   free
#   $ gh api repos/tessaryai/tessary --jq .isPrivate
#   true
# GitHub code scanning with the CodeQL Action requires GitHub Advanced Security on a PRIVATE
# repository, and GHAS is not included in a free org plan. THIS WORKFLOW CANNOT SUCCEED TODAY —
# not because it is misconfigured, but because the feature it drives is not purchased. It is
# authored and fully wired anyway, the same "authored but not armed" precedent
# open-edition-boot.yml set for a CI-minutes reason: the weekly cron below will fail loudly until
# either GHAS is purchased or this repo goes public, which is the honest signal — a silently
# absent workflow would look like nobody thought about CodeQL at all, and a comment saying so
# without a workflow to point at is a claim nobody can verify.
#
# `on: workflow_dispatch` + weekly cron only, same settled human decision as
# the former dependency-audit.yml (dropped from CI 2026-09-02; see scripts/check-dependency-audit.sh's header) — NOT because of the free-tier minutes
# trade this time, but there is no reason to diverge from the repo's one established posture for
# an unarmed gate, and doing so would need its own justification not otherwise present here.
#
# THE MOMENT EITHER BLOCKER LIFTS: no change needed here beyond removing this comment block —
# the job is already correct. Re-check both `gh api` calls above periodically; the moment neither
# 403s/plan-gates, this can go on `pull_request:` for real (mirroring open-edition.yml's own
# documented one-line path from dispatch-only to armed).
#
# LANGUAGES: java-kotlin covers backend/ (Java 25, no Kotlin sources), javascript-typescript
# covers frontend/, classify-service/ and sandbox-runner/ — verified as the current combined
# CodeQL language ids 2026-09-01 against
# github/codeql-action's init action schema. `build-mode: none` for both: javascript-typescript
# is interpreted (always `none`). java-kotlin's `none` mode is documented as skipping any Kotlin
# source with a warning rather than failing — this reactor has none, so it covers backend/'s Java
# fully; if Kotlin ever entered the reactor this row would need `autobuild` instead. AFTER
# IMPLEMENTATION, IF THIS EVER RUNS: verify the analyze step's "files analyzed" count is
# non-trivial, not just a green checkmark — a wrong build-mode can silently analyze nothing, per
# this issue's own plan.
# ALL AUTOMATIC TRIGGERS ARE DISABLED. Nothing in this repository starts a workflow run on its
# own; every workflow here is `workflow_dispatch` only, so runs happen when a human presses Run.
# The original trigger block for this file is preserved commented-out immediately below —
# re-enabling is uncommenting it, nothing else.
# on:
#   schedule:
#     - cron: '0 4 * * 1' # Mondays 04:00 UTC — offset from ci.yml (03:00)
#                          # (03:30) so the three weekly jobs don't contend for the same minute.
#   workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
