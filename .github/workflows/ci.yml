name: CI

# A weekly backstop, not a per-PR gate. The full gate (backend = mvn verify with Testcontainers)
# is too expensive to run on every push/PR on free minutes, and the local `task check` (see
# CLAUDE.md) runs the identical scripts, so per-PR enforcement is the developer's machine. What
# CI adds weekly is the one check a laptop can skip silently: the vendored-plugin freshness diff
# hard-fails here ($CI set) instead of warning-and-passing offline. workflow_dispatch is there
# for on-demand runs before a risky merge.
#
# Free-tier caveat: GitHub disables scheduled workflows after 60 days without repo activity; a
# commit (or re-enabling by hand) revives it.
#
# All automatic triggers are disabled. Nothing in this repository starts a workflow run on its
# own; every workflow here is `workflow_dispatch` only, so runs happen when a human presses Run.
# The original trigger block for this file is preserved commented-out immediately below;
# re-enabling is uncommenting it, nothing else.
# on:
#   schedule:
#     - cron: '0 3 * * 1' # Mondays 03:00 UTC, on main
#   workflow_dispatch:
#   # Scoped so it changes nothing about the trade above: every job below except overlay-schema
#   # carries `if: github.event_name != 'pull_request'`, so a pull_request event runs only the
#   # new job (its static half; the Docker half stays schedule/workflow_dispatch-only inside that
#   # job, guarded the same way). The other jobs stay weekly-cron/workflow_dispatch, same as the
#   # header above still says.
#   pull_request:

on:
  workflow_dispatch:

jobs:
  pipeline-vocabulary:
    name: Classifier pipeline vocabulary (dropped relations)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # Seconds, and it catches the one class of break nothing else can see: a SQL string naming a
      # table the classifier-pipeline cutover dropped compiles fine and fails at runtime.
      - run: bash scripts/check-pipeline-vocabulary.sh

  open-boundary:
    name: Open/paid boundary (tessary-paid overlay)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # Seconds. The Maven half of this (an open module declaring a paid dependency) fails in the
      # backend job below; this catches what a reactor cannot see: paid package names left in open
      # source, the frontend, the open image's build inputs, and the overlay wiring going missing.
      - run: bash scripts/check-open-boundary.sh

  license-headers:
    name: License headers (SPDX over the publishable tree)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # Seconds: a text scan, no toolchain beyond python3 (already on ubuntu-latest). Needs no
      # new `pull_request` trigger of its own: this is `task check`'s manifest row for the same
      # gate, so a contributor running `task check` locally already hits this before a PR opens.
      # This job is the weekly/on-demand backstop for the "every release at minimum" manual-audit
      # cadence, given this plan tier 403s branch protection and the rulesets API and nothing can
      # make a red run here actually block a merge yet. See scripts/check-license-headers.sh's own
      # header for the full interim-posture reasoning.
      - run: bash scripts/check-license-headers.sh

  contract:
    name: Vendored evals contract (consistency)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # The exact gate `task contract:check` runs: single source of truth.
      - run: bash scripts/check-contract-consistency.sh

  vendored-plugin:
    name: Vendored evals plugin (validator rules + freshness)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Major-pinned, not exact-pinned. Unpinned, a new pytest major reddens main on a day nobody
      # changed anything; exact-pinned, CI drifts from whatever developers have locally and the
      # repo's "local green ⇒ CI green by construction" property quietly stops holding.
      - run: pip install 'pyyaml~=6.0' 'pytest~=9.0'
      # The exact gate `task contract:plugin` runs: single source of truth.
      #
      # The plugin repo (tessaryai/plugins) is public and deliberately runs no PR CI, so the
      # enforcement for its contract lives here instead. The freshness half reads raw file
      # contents from that repo over unauthenticated HTTPS and writes nothing back, so it leaves
      # no trace there. $CI is set by Actions, which makes an unreachable plugin repo a hard
      # failure rather than a skip.
      - run: bash scripts/check-vendored-plugin.sh

  backend:
    name: Backend (Spring Boot, Java 25)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The exact gate `task backend:check` runs: single source of truth.
      - run: bash scripts/check-backend.sh
      # Coverage baseline, open modules only. The JaCoCo report is a build-time side effect of
      # `mvn verify` now (see backend/pom.xml's pluginManagement); this step just captures it.
      # `if: always()` so a red run still leaves a baseline to look at, not just a green one. No
      # new job, no new trigger: still weekly/dispatch-only, same as the rest of this file's
      # header explains. A CI-artifact refresh cadence is not what this step is for; `task
      # backend:coverage` is (see Taskfile.yml). The glob only reaches backend/*, so nothing
      # outside it is included.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-jacoco-coverage
          path: backend/*/target/site/jacoco/**
          if-no-files-found: warn

  frontend:
    name: Frontend (Vite, TypeScript)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup must come before setup-node: setup-node's `cache: pnpm` resolves the store
      # path by shelling out to pnpm, so it fails if pnpm isn't on PATH yet. Version comes from the
      # `packageManager` field in frontend/package.json; don't pin a second one here.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # The exact gate `task frontend:check` runs: single source of truth.
      - run: bash scripts/check-frontend.sh
      # A step in this job rather than a job of its own, and that is forced rather than tidy: the
      # overlay's frontend has no package.json and no lockfile of its own, so it borrows this
      # one's installed tree through a symlink the gate script creates and can only run where
      # `pnpm install` has already run, which is here. Guarded on the overlay existing: a
      # checkout with no overlay has nothing here to build.
      - name: Paid frontend surfaces (tessary-paid overlay)
        run: |
          if [ -d tessary-paid ]; then
            bash tessary-paid/scripts/check-paid-frontend.sh
          else
            echo "frontend:check:paid skipped — no tessary-paid/ overlay (the open edition has no paid frontend surfaces)"
          fi

  classify-service:
    name: classify-service (encoder heads)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # Before setup-node; see the frontend job.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: classify-service/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: classify-service/pnpm-lock.yaml
      # The exact gate the Taskfile runs (`task classify:check`): single source of truth.
      # (It installs its own deps; no separate install step here.)
      - run: bash scripts/check-classify-service.sh

  # There is no slack-service job here: the adapter and its gate are overlay-owned, and this
  # workflow file publishes, so a job running `bash scripts/check-slack-service.sh` would be a
  # public CI job pointing at a script the public repo does not contain. The overlay repo runs it
  # through scripts/check.sh's `slack-service` manifest row (RUN_IF_PRESENT), which needs no job
  # here.

  sandbox-runner:
    name: sandbox-runner/launcher (docker sandbox driver) + agent-sandbox
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # Before setup-node; see the frontend job. The launcher has no deps of its own, but the
      # agent-sandbox leg of the gate below installs sandbox-runner/agent-sandbox's runtime deps
      # (undici, @opencode-ai/sdk, ...) for the agent-stream.js retry-coverage test, so this job
      # needs pnpm on PATH.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sandbox-runner/agent-sandbox/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The exact gate `task sandbox-runner:check` runs: single source of truth. node:test
      # against a fake Docker daemon over a temp unix socket, so this job needs no Docker socket
      # of its own; see scripts/check-sandbox-runner-launcher.sh's own header.
      - run: bash scripts/check-sandbox-runner-launcher.sh

  compile-service:
    name: compile-service (SOP conformance fit/export)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # `if:` because the glob below names a file the public export does not have. The work this
      # step feeds is already guarded (see the run step), but the step itself was not: on a
      # checkout with no overlay, setup-uv was asked to key its cache on a lockfile that is not
      # there. Skipping the whole step is safe precisely because the guarded run below needs no uv
      # when the overlay is absent; it only echoes a skip. Found by check-open-boundary.sh rule 7,
      # which also covers this file and Taskfile.yml.
      - uses: astral-sh/setup-uv@v7
        if: hashFiles('tessary-paid/compile-service/uv.lock') != ''
        with:
          enable-cache: true
          cache-dependency-glob: tessary-paid/compile-service/uv.lock
      # The exact gate the Taskfile runs (`task compile:check`): single source of truth.
      # (It syncs its own deps from the lockfile; no separate install step here.)
      #
      # Guarded on the overlay existing: the service, the engine it runs and this gate all moved
      # into the overlay together, so a checkout with no overlay has no SOP compile service and
      # this job correctly has nothing to run. It reports a skip rather than failing, because a
      # missing overlay directory is not a broken build.
      - run: |
          if [ -d tessary-paid ]; then
            bash tessary-paid/scripts/check-compile-service.sh
          else
            echo "compile:check skipped — no tessary-paid/ overlay (the open edition has no SOP compile service)"
          fi

  conformance-parity:
    name: Conformance parity fixture (Python engine ↔ Java port)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: classifiers/uv.lock
      # The exact gate `task conformance:parity` runs: single source of truth.
      #
      # conformance_parity.json is what pins the Java conformance port to the Python engine, and
      # until this job existed nothing regenerated it: the backend suite read the fixture, so a
      # Java change was caught and a Python change was not. The fixture would keep pinning the
      # port to an engine that no longer existed, green all the way, the silent-divergence class
      # that cost this project a round of measurements once already. Seconds to run: the generator
      # needs numpy and nothing else.
      #
      # No overlay guard here any more: the script self-guards, and on the right predicate. Its
      # hard dependency is `classifiers/`, where it cds and where the generator's package lives,
      # not the overlay, so a caller guard on the overlay's presence was correct only by accident.
      # It now skips on `--edition open` and on `classifiers/` being absent, and says so.
      - run: bash scripts/check-conformance-parity.sh

  classifier-quality-doc:
    name: Classifier quality page (matches deployed heads + thresholds)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # The exact gate `scripts/check.sh` runs. Asserts the measured-quality reference page still
      # describes the heads and thresholds actually deployed, so a retrain or a threshold move
      # cannot silently leave it asserting a quality the classifier no longer has. The page and
      # the populated model manifest are both overlay-owned, so the guard below is false in this
      # checkout and true only where the overlay is checked out. That is the intended shape, not a
      # stale guard: the gate's whole subject is a page this repo does not ship. Kept as an `if`
      # rather than deleted so a checkout with the overlay still runs it, and this job hands the
      # script both overlay paths, because check-open-boundary.sh rule 5 forbids that script from
      # naming the overlay itself, so its own defaults are the open ones and a caller has to
      # supply them.
      - run: |
          if [ -f tessary-paid/devdocs/reference/classifier-quality.md ]; then
            CQ_DOC=tessary-paid/devdocs/reference/classifier-quality.md \
            CQ_MODELS=tessary-paid/classify-service/models.json \
              bash scripts/check-classifier-quality-doc.sh
          else
            echo "classifier-quality-doc skipped: the measured-quality page is overlay-owned and is not in this checkout"
          fi

  docs-links:
    name: Docs (relative markdown links resolve)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # The exact gate `scripts/check.sh` runs: single source of truth. Needs nothing but python3,
      # which the runner already has, so it costs seconds and catches the class of rot that a doc
      # deletion leaves behind (see the script header for the three times it has bitten).
      - run: bash scripts/check-docs-links.sh

  caddy:
    name: Caddyfile (reverse proxy config)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Install Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy
      # The exact gates `task caddy:validate` runs: single source of truth.
      - run: bash scripts/check-caddy.sh
      # The overlay's own caller for the shared route-coverage checker. An open script may not
      # name the overlay directly (check-open-boundary.sh rule 5), and the overlay's production
      # config is the one no boot check reaches. A directory probe, never a flag, so the open tree
      # stays coherent.
      - run: |
          if [ -d tessary-paid ]; then
            bash tessary-paid/scripts/check-paid-caddy.sh
          else
            echo "check-paid-caddy skipped — no tessary-paid/ overlay"
          fi

  overlay-schema:
    name: overlay-schema (ordering-contract lint + populated check)
    runs-on: ubuntu-latest
    # Deliberately no job-level `if:`: this is the one job the `pull_request` trigger above runs.
    # Its static half (seconds, no Docker) runs on every PR; its Docker half and the
    # populated-migration step stay schedule/workflow_dispatch-only, guarded step by step below,
    # the same way compile-service's overlay probe stays conditional rather than unconditional.
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow single-commit checkout: the overlay's freeze
          # check needs `git merge-base HEAD origin/main` to resolve, and a pull_request event's
          # default depth-1 checkout of just the merge commit leaves no origin/main ref and no
          # parent to fall back to (HEAD~), so the rule would fail every PR with "cannot determine
          # what is frozen" regardless of whether any changeset actually changed. Same fix
          # open-edition-boot.yml already applies for the same reason.
          fetch-depth: 0
      # `if:` because setup-java pulls a toolchain the static lint alone does not need, and the
      # public export has no overlay pom.xml to key a cache on, same rule-7 shape as the
      # compile-service job's setup-uv step above.
      - uses: actions/setup-java@v6
        if: hashFiles('tessary-paid/pom.xml') != ''
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Resolves the Postgres JDBC driver into ~/.m2 so the Docker half (which mounts it into the
      # liquibase CLI image) finds it, the same lookup check-migrations-populated.sh's own header
      # describes. `-pl core -am` resolves, it does not build.
      - name: Resolve the Postgres JDBC driver
        if: hashFiles('tessary-paid/pom.xml') != ''
        run: mvn -B -q -f backend/pom.xml -pl core -am -DskipTests compile
      # The exact gate `task check:overlay-schema` runs (the ordering-contract lint): single
      # source of truth. The static rules run on every pull_request; --with-docker (the
      # throwaway-Postgres proof) is added only off pull_request, so a PR gets the fast lint and
      # the weekly/dispatch run gets the full proof. Guarded on the overlay existing, the shape
      # every overlay-owned gate in this file uses: a checkout with no overlay has no overlay
      # changelog to lint.
      - run: |
          if [ -d tessary-paid ]; then
            bash tessary-paid/scripts/check-overlay-schema.sh $( [ "$GITHUB_EVENT_NAME" != pull_request ] && echo --with-docker )
          else
            echo "check:overlay-schema skipped — no tessary-paid/ overlay (the open edition has no overlay changelog to lint)"
          fi
      # The populated-database gate (task migrations:populated), open lane always and the overlay
      # lane when present. Not part of the static lint above and not run on pull_request: like the
      # Docker half above, it wants a throwaway Postgres and minutes, which belongs on the weekly
      # cadence, not a per-PR gate.
      - name: Populated-migration gate (both editions)
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/check-migrations-populated.sh
          if [ -f tessary-paid/pom.xml ]; then
            MIGPOP_OVERLAY_DIR="$(pwd)/tessary-paid/db/src/main/resources" bash scripts/check-migrations-populated.sh
          fi
