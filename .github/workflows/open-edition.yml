name: Open edition

# THE OPEN-EDITION GATE (#849 AC1), BUILT BUT NOT ARMED. `ci.yml` is a deliberate weekly cron
# (see its own header) — this is the new file beside it, not an edit to it, because a job landing
# inside `ci.yml` inherits that file's `on:` block, and this gate is meant to answer per PR rather
# than once a week. It does not do that YET: see the `on:` block below, which is dispatch-only
# until there are CI minutes for it.
#
# ONE JOB, ONE LINE OF SUBSTANCE: `bash scripts/check.sh --edition open` (#875) is the CI-callable
# interface — see that script's own header ("THE CI-CALLABLE INTERFACE IS THIS SCRIPT, NOT THE
# TASK TARGET"). Everything above the final step exists only to assemble the FIVE toolchains that
# line needs in one job, which scripts/check.sh:36-49 names explicitly and warns against
# shortcutting: naming only `setup-java` here (mirroring `ci.yml`'s `backend` job) sends this
# workflow to a job that dies on the second gate (frontend). The five, and which gate needs each:
#   actions/setup-java (25)   -- backend (-P '!paid'), and check-backend.sh hard-fails on any
#                                other JDK before Maven even starts
#   pnpm + actions/setup-node -- frontend, and classify-service's own install step
#   astral-sh/setup-uv        -- classifier-parity (--edition open). #1293 moved all six of its
#                                pins into the overlay, so under --edition open it now runs ZERO
#                                pins and prints a named skip; uv is still needed here because the
#                                script reaches uv before it decides that. slack-service is no
#                                longer in this list at all — its gate is overlay-owned now.
#   actions/setup-python      -- vendored-plugin (pip install pyyaml + pytest)
#   caddy on PATH             -- the caddy gate (validate)
# Order matters once, the same way it does in `ci.yml`'s `frontend` job: pnpm/action-setup MUST
# run before actions/setup-node, because setup-node's `cache: pnpm` resolves the store path by
# shelling out to `pnpm`, which does not exist on PATH yet otherwise.
#
# WHAT THIS RUN DOES NOT PROVE. `--edition open` runs with `tessary-paid/` still on disk (this
# workflow checks out the whole repo, overlay included) and only changes what scripts/check.sh
# ASKS for — see that script's "MODE IS A PROXY" note. The gates whose disposition differs by
# edition (paid-frontend, compile-service) are SKIPPED here unconditionally, by manifest row, not
# because the overlay happens to be absent. Proving the export itself — that the tree survives
# `tessary-paid/` actually being GONE — is the separate, dispatch-only boot check in
# open-edition-boot.yml (#849 AC4), not this workflow.
#
# ---------------------------------------------------------------------------------------------
# "REQUIRED" HERE IS A DOCUMENTED CONVENTION, NOT A GITHUB-ENFORCED GATE. READ THIS BEFORE
# ASSUMING A RED RUN BLOCKS A MERGE.
# ---------------------------------------------------------------------------------------------
# This workflow is INTENDED to become a required check on `main` once it is armed per PR. Two
# separate things stand between here and there. The first is the `on:` block below, which is
# dispatch-only by decision. The second is that GitHub's native required-status-check mechanism
# is unavailable on this repo TODAY, independent of anything in this file:
#
#   $ gh api repos/tessaryai/tessary/branches/main/protection
#   $ gh api repos/tessaryai/tessary/rulesets
#
# both return, verbatim, as of 2026-08-31:
#
#   403 {"message":"Upgrade to GitHub Pro or make this repository public to enable this feature."}
#
# This repo is private on a plan tier that does not offer branch protection or repository
# rulesets. Until the org's GitHub plan changes or the repo goes public, NOTHING enforces
# "required" here except discipline: a RED run of this workflow CAN currently be merged past, and
# GitHub will not stop it. Treat a red check the same way you would treat a required one being
# red — do not merge past it — but know that the only thing making you do that is this comment,
# not the platform. Re-check both API calls above once the plan or visibility changes; the moment
# either stops 403ing, wire this workflow into branch protection / a ruleset for real and delete
# this section. The matching ledger entry is the divergence log dated 2026-08-31 in the internal
# execution plan (overlay-owned since #1293; it is not part of this repo's public export).
on:
  # DISPATCH-ONLY, deliberately. Same trade, and the same decision, as open-edition-boot.yml
  # beside it: "Add the CI check but don't enable it per PR, note it down somewhere, we will
  # enable it later once we get more CI minutes." A `pull_request:` line here spends a full
  # five-toolchain job on every push to every open PR, which is the entire free-tier budget on
  # a 24-PR stack.
  #
  # THE ONE-LINE CHANGE THAT TURNS IT ON: add `pull_request:` back under `on:`. Nothing else in
  # this file needs to change — the job below is already the per-PR gate, it just is not armed.
  workflow_dispatch:

jobs:
  open-edition:
    name: Open edition (tree minus tessary-paid/, --edition open)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Before setup-node: setup-node's `cache: pnpm` shells out to pnpm to resolve the store
      # path, so pnpm has to be on PATH first — see ci.yml's `frontend` job for the same ordering.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # classify-service pins the same pnpm version (packageManager: pnpm@11.15.1) and installs
      # its own deps inside check-classify-service.sh — no separate install step needed here,
      # matching ci.yml's classify-service job.

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # One lockfile, not two: #1293 moved slack-service/ (and its uv.lock) into the overlay,
          # which this OPEN-edition workflow never checks out. classifiers/uv.lock stays — the
          # public half of the classifier tree keeps it.
          cache-dependency-glob: classifiers/uv.lock

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Major-pinned, not exact-pinned — see ci.yml's vendored-plugin job for why.
      - run: pip install 'pyyaml~=6.0' 'pytest~=9.0'

      - name: Install Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy

      # The exact gate `task check:open` runs — single source of truth. See scripts/check.sh's own
      # header: CI never loads the Taskfile, so this calls the script directly.
      - run: bash scripts/check.sh --edition open
