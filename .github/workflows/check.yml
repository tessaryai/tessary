name: Check

# scripts/check.sh split into three parallel jobs: backend tests, backend lint, and everything else.
# `task check` still runs all of it locally. Nothing is merge-blocking: this repo's plan offers no
# branch protection, so a red run is blocking by convention only.
on:
  pull_request:
    # Doc-only PRs skip this; no gate reads prose (see scripts/check.sh). A denylist so a new code
    # directory is gated by default. Not `**/*.md`: prompt-craft/**/*.md are build inputs.
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - '**/AGENTS.md'
      - 'docs/**'
      - 'devdocs/**'
      - 'handbook/**'
      - '.github/**'
    # ready_for_review runs a PR opened as a draft. closed runs nothing but enters the concurrency
    # group, which cancels the in-flight run on merge.
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job's `if:` skips drafts and closes. The event_name clause is required: on workflow_dispatch
# `github.event.pull_request.draft` is null, and `null == false` is false.
jobs:
  backend-tests:
    name: Backend tests and coverage
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: bash scripts/check-backend.sh tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-jacoco-coverage
          path: backend/*/target/site/jacoco*/**
          if-no-files-found: warn

  backend-lint:
    name: Backend lint (Spotless, forbidden-apis, SpotBugs, Error Prone)
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: bash scripts/check-backend.sh lint

  gates:
    name: Frontend and repo gates
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: its `cache: pnpm` shells out to pnpm to resolve the store path.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      # The groundedness gates use uv without syncing classifiers/uv.lock, so there is nothing to
      # cache. The python3 gates need only the standard library, which the runner image provides.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install Caddy
        # A pinned release binary is all check-caddy.sh needs (`caddy validate`). The release's
        # checksums file is SHA-512, so bump CADDY_VERSION and CADDY_SHA512 together.
        env:
          CADDY_VERSION: 2.11.4
          CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          set -euo pipefail
          tarball="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          workdir="$(mktemp -d)"
          cd "$workdir"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
               --output "$tarball" \
               "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/${tarball}"
          echo "${CADDY_SHA512}  ${tarball}" | sha512sum --check --strict -
          sudo tar -xzf "$tarball" -C /usr/local/bin caddy
          sudo chmod 0755 /usr/local/bin/caddy
          cd / && rm -rf "$workdir"
          caddy version

      - run: bash scripts/check.sh --skip-backend
