name: Price book refresh

# #990 (open-core epic 8, Track B): keep LiteLLM/BerriAI as the price source and automate the
# refresh cadence — scripts/refresh-model-prices.sh already exists and does the fetch-and-vendor
# work; this workflow is just the "run it on a schedule and open a PR with the result" wrapper
# around it. See that script's own header for why the source stays vendored rather than fetched
# at runtime, why the copy is verbatim, and where the no-token-rate guard now lives.
#
# NO VERIFICATION GATE, DELIBERATELY. An earlier draft ran a drift check between the old and new
# file and refused to open a PR on an implausible delta. Dropped on 2026-09-02: we take LiteLLM's
# pricing at its word (their registry commits cite the provider's own pricing page, land 10-20x a
# day, and some ship tests alongside), so a heuristic second-guessing them was buying a false
# sense of review rather than review. The review that matters is a human reading the diff on the
# PR this opens, which is the same review the script's header has always asked for.
#
# THIS IS THE FIRST WORKFLOW IN THIS REPO THAT OPENS A PULL REQUEST. Every other workflow here is
# read-only or deploy-only (grep `permissions:` across this directory: contents: read plus
# id-token/packages/security-events write, nothing that touches contents: write or
# pull-requests: write). Two consequences a reviewer should know before this can go green:
#   1. A human must enable, once, repo Settings -> Actions -> General -> "Allow GitHub Actions to
#      create and approve pull requests". Without it, `gh pr create` below 403s — loud failure,
#      not a silent no-op, which is the correct behavior until that's turned on.
#   2. PRs authored by the default GITHUB_TOKEN don't trigger other `pull_request`-scoped
#      workflows (a GitHub platform limitation, not a bug here). That's moot in practice today —
#      every workflow in this repo is `schedule` + `workflow_dispatch` only, none trigger on
#      `pull_request` — but it's worth stating so a reviewer isn't confused by the opened PR
#      showing no CI status check.
#
# GitHub disables scheduled workflows after 60 days without repository activity (ci.yml's header
# carries the same caveat). A daily cron does not fix this — the disable trips on repository
# inactivity, not on cron frequency — and it does not make it worse either.
# ALL AUTOMATIC TRIGGERS ARE DISABLED. Nothing in this repository starts a workflow run on its
# own; every workflow here is `workflow_dispatch` only, so runs happen when a human presses Run.
# Re-arming them is tracked as #1184 (epic 11, public repo cutover). The original trigger
# block for this file is preserved commented-out immediately below — re-enabling is uncommenting
# it, nothing else.
# on:
#   schedule:
#     # DAILY 05:00 UTC. Unlike every other cron in this repo (ci.yml 0 3 * * 1, codeql.yml 0 4 * * 1 — all Mondays-only), this one runs every day ON PURPOSE: a
#     # stale price book doesn't just mis-render a number, it corrupts the cost_drift classifier's
#     # output (MetricSource reads TokenPriceBook, which reads this same vendored file), so the
#     # staleness window is a correctness window, not a display-freshness nicety. Upstream commits to
#     # this file 10-20 times a day, so even daily bundles a dozen changes per PR; weekly would
#     # bundle ninety, which nobody reviews honestly. On Mondays this still lands clear of the other
#     # three (one hour after codeql.yml's 04:00, two after ci.yml's 03:00). On a no-change day the
#     # job costs a curl, a diff and an exit.
#     - cron: '0 5 * * *'
#   workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write   # net-new in this repo — see the header above

jobs:
  refresh:
    name: Refresh vendored LiteLLM price book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: refresh vendored price book
        run: bash scripts/refresh-model-prices.sh

      - name: check for changes
        id: diff
        run: |
          if git diff --quiet -- backend/substrate/src/main/resources/pricing/litellm-model-prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A FIXED BRANCH NAME, FORCE-PUSHED AND REUSED IF ALREADY OPEN — load-bearing at a daily
      # cadence, not just tidy. A date-stamped or per-run branch would open a brand-new PR every
      # morning the previous one goes unreviewed, so a quiet fortnight would leave fourteen open
      # PRs behind instead of one PR that keeps accumulating the latest diff.
      #
      # The branch is rebuilt from the checked-out commit each run rather than added to, so the PR
      # always carries exactly one commit: today's upstream state against main. Without that, a PR
      # left open for a week would grow a week of intermediate commits nobody wants to read.
      - name: open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/price-book-refresh
          git add backend/substrate/src/main/resources/pricing/litellm-model-prices.json
          git commit -m "chore(pricing): refresh vendored LiteLLM price book"
          git push --force origin automation/price-book-refresh
          if gh pr list --head automation/price-book-refresh --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR already open for automation/price-book-refresh; force-push updated it in place."
          else
            gh pr create --head automation/price-book-refresh --base main \
              --title "chore(pricing): refresh vendored LiteLLM price book" \
              --body "Automated daily refresh of the vendored LiteLLM price book, opened by \`.github/workflows/price-book-refresh.yml\` (#990).

          The file is a verbatim copy of [BerriAI/litellm's \`model_prices_and_context_window.json\`](https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json). Review the diff below: it is exactly what upstream published, with no transformation in between.

          Entries carrying neither an input nor an output token rate are vendored but read as unpriced rather than as \$0.00 — see \`TokenPriceBook.hasTokenRate\`.

          There is no hand-maintained correction file layered over this one (#1032 retired \`manual-overrides.json\`) — a stale or wrong row is a bug to raise with LiteLLM upstream."
          fi
