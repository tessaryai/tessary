name: Price book refresh

# Keeps LiteLLM/BerriAI as the price source and automates the refresh cadence.
# scripts/refresh-model-prices.sh does the fetch-and-vendor work; this workflow just runs it on a
# schedule and opens a PR with the result. See that script's own header for why the source stays
# vendored rather than fetched at runtime, why the copy is verbatim, and where the no-token-rate
# guard lives.
#
# NO VERIFICATION GATE, DELIBERATELY. An earlier draft ran a drift check between the old and new
# file and refused to open a PR on an implausible delta. Dropped: we take LiteLLM's pricing at its
# word (their registry commits cite the provider's own pricing page, land 10-20x a day, and some
# ship tests alongside), so a heuristic second-guessing them was buying a false sense of review
# rather than review. The review that matters is a human reading the diff on the PR this opens.
#
# THIS IS THE FIRST WORKFLOW IN THIS REPO THAT OPENS A PULL REQUEST. Every other workflow here is
# read-only or deploy-only (grep `permissions:` across this directory: contents: read plus
# id-token/packages/security-events write, nothing that touches contents: write or
# pull-requests: write). Two consequences a reviewer should know before this can go green:
#   1. A human must enable, once, repo Settings -> Actions -> General -> "Allow GitHub Actions to
#      create and approve pull requests". Without it, `gh pr create` below 403s — loud failure,
#      not a silent no-op, which is the correct behavior until that's turned on.
#   2. PRs authored by the default GITHUB_TOKEN don't trigger other `pull_request`-scoped
#      workflows (a GitHub platform limitation, not a bug here), and check.yml IS one, so the PR
#      this opens shows no CI status check. That is why the job below runs
#      scripts/check-price-book-contract.sh itself before it pushes: the one gate that matters to
#      this file (tessary-home fetches it by raw URL, see that script's header) cannot be skipped by
#      the only PRs that routinely change it.
#
# GitHub disables scheduled workflows after 60 days without repository activity (drift-checks.yml's
# header carries the same caveat). A frequent cron does not fix this: the disable trips on repository
# inactivity, not on cron frequency, and it does not make it worse either.
#
# DAILY 05:00 UTC. tessary-home's publish-pricing.yml fetches this file from main once a day at
# 07:20 UTC, so a refresh merged before then is published the same day. Upstream commits to
# LiteLLM's file 10-20 times a day, so daily bundles about a dozen changes per PR; weekly would
# bundle ninety, which nobody reviews honestly. The fixed, force-pushed branch below keeps it to ONE
# open PR however many days it goes unreviewed. On a no-change day the job costs a curl, a diff and
# an exit.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write   # net-new in this repo — see the header above

jobs:
  refresh:
    name: Refresh vendored LiteLLM price book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: refresh vendored price book
        run: bash scripts/refresh-model-prices.sh

      # Before the diff, so a refresh that would break tessary-home's fetch never becomes a PR.
      - name: price book contract
        run: bash scripts/check-price-book-contract.sh

      - name: check for changes
        id: diff
        run: |
          if git diff --quiet -- backend/substrate/src/main/resources/pricing/litellm-model-prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A FIXED BRANCH NAME, FORCE-PUSHED AND REUSED IF ALREADY OPEN — load-bearing at a daily
      # cadence, not just tidy. A date-stamped or per-run branch would open a brand-new PR every
      # morning the previous one goes unreviewed, so a quiet fortnight would leave fourteen open
      # PRs behind instead of one PR that keeps accumulating the latest diff.
      #
      # The branch is rebuilt from the checked-out commit each run rather than added to, so the PR
      # always carries exactly one commit: today's upstream state against main. Without that, a PR
      # left open for a week would grow a week of intermediate commits nobody wants to read.
      - name: open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/price-book-refresh
          git add backend/substrate/src/main/resources/pricing/litellm-model-prices.json
          git commit -m "chore(pricing): refresh vendored LiteLLM price book"
          git push --force origin automation/price-book-refresh
          if gh pr list --head automation/price-book-refresh --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR already open for automation/price-book-refresh; force-push updated it in place."
          else
            gh pr create --head automation/price-book-refresh --base main \
              --title "chore(pricing): refresh vendored LiteLLM price book" \
              --body "Automated daily refresh of the vendored LiteLLM price book, opened by \`.github/workflows/price-book-refresh.yml\`.

          The file is a verbatim copy of [BerriAI/litellm's \`model_prices_and_context_window.json\`](https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json). Review the diff below: it is exactly what upstream published, with no transformation in between.

          Entries carrying neither an input nor an output token rate are vendored but read as unpriced rather than as \$0.00 — see \`TokenPriceBook.hasTokenRate\`.

          There is no hand-maintained correction file layered over this one (\`manual-overrides.json\` is retired) — a stale or wrong row is a bug to raise with LiteLLM upstream."
          fi
