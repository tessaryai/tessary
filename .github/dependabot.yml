version: 2

# Dependency-update PRs only. This file does not gate anything: it opens PRs that bump a
# manifest, and those go through the normal review/CI path like any other PR. CVE scanning is
# a separate concern, handled by scripts/check-dependency-audit.sh, run on demand by a human.
#
# Directories not listed here are covered elsewhere or bumped by hand; see
# check-open-boundary.sh for the rule this file has to satisfy.
#
# The uv trees use the `uv` ecosystem, not `pip`: this repo has no requirements*.txt or
# setup.py, and `uv` reads pyproject.toml + uv.lock directly.
#
# Weekly, Mondays, to keep PR review noise predictable.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: npm
    directory: /classify-service
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Pinned to match the version @huggingface/transformers resolves, so only one native ONNX
      # Runtime ships. Dependabot can only bump this alone, which would land a second copy next
      # to transformers': bump it by hand, in lockstep with the transformers.js dependency.
      - dependency-name: onnxruntime-node

  - package-ecosystem: npm
    directory: /sandbox-runner/launcher
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: npm
    directory: /sandbox-runner/agent-sandbox
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Both of these mirror install lines baked into the E2B runtime image (template.ts and
      # Dockerfile) and must move together with them, which a manifest-only PR can't do:
      # @opencode-ai/sdk stays in lockstep with the opencode-ai CLI the template installs
      # globally; undici stays on major version 6 so this line matches the runtime recipes.
      # Minors and patches still flow.
      - dependency-name: "@opencode-ai/sdk"
      - dependency-name: undici
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /classifiers
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
