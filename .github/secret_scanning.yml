# Paths GitHub's own secret scanning skips. Each entry is also exempted in .gitleaks.toml, with its reason there.
#
# The vendored rule set carries the upstream scanner's allowlist: publicly known example keys that the rule
# must not fire on. They are third-party sample keys, not Tessary credentials, so every re-sync would
# otherwise raise one alert per key.
paths-ignore:
  - "backend/substrate/src/main/resources/redaction/gitleaks-rules.json"
