# Ingest throughput overlay on docker-compose.yml (not the dev stack); see scripts/bench/README.md.
# docker compose -f docker-compose.yml -f docker-compose.bench.yml up -d
# Pins a stated 4 vCPU / 8 GiB box (backend 2/2048, postgres 1.25/3072, caddy 0.5/512, sandbox-runner
# 0.25/1536) and turns on JFR and native memory tracking. JAVA_TOOL_OPTIONS adds to the image's flags.

services:
  backend:
    cpus: 2.0
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:NativeMemoryTracking=summary
        -XX:StartFlightRecording=name=ingest,settings=${BENCH_JFR_SETTINGS:-default},disk=true,maxsize=1g,maxage=2h,dumponexit=true,filename=/jfr/ingest.jfr
        -XX:FlightRecorderOptions=repository=/jfr/repo
      PYROSCOPE_AGENT_ENABLED: "false"
      # Finer queue-depth heartbeat for ramp steps; logging cadence only.
      TESSARY_INGEST_SUBSTRATE_REPORT_MS: "10000"
      # Lets an A/B flip one property between arms; empty leaves every default.
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
    volumes:
      - ./.local/bench/jfr:/jfr
      # The image has no jcmd. A sidecar JDK attaches through a socket in /tmp, so /tmp is a shared named volume.
      - bench-tmp:/tmp

  postgres:
    cpus: 1.25
    mem_limit: 3g

  frontend:
    cpus: 0.5
    mem_limit: 512m

  sandbox-runner:
    cpus: 0.25

volumes:
  bench-tmp:
