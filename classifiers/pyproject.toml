[project]
name = "tessary-classifiers"
version = "0.1.0"
description = "The groundedness model server."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
# serve.py's model half runs only against the downloaded checkpoint on a real device: scoring
# through torch, and the process entry point that loads the model before binding the port.
exclude_also = [
    "    def score\\(self, passages",
    "^def main\\(\\)",
    "^if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 118
target-version = "py311"
