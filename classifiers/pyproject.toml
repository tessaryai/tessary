[project]
name = "tessary-classifiers"
version = "0.1.0"
description = "The groundedness model server and the OTLP trace emitter the open boot check runs."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# data_gen/emit_local.py. The platform's OTLP receiver is protobuf-only, so the proto-http exporter
# is required, not the grpc one.
otlp = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# emit_local.py is boot-check tooling that only talks to a running platform.
omit = ["data_gen/emit_local.py", "tests/*"]

[tool.coverage.report]
# serve.py's model half runs only against the downloaded checkpoint on a real device: scoring
# through torch, and the process entry point that loads the model before binding the port.
exclude_also = [
    "    def score\\(self, passages",
    "^def main\\(\\)",
    "^if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 118
target-version = "py311"
